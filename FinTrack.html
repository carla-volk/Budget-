<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinTrack Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0c10;color:#e2e8f0;font-family:'Inter',-apple-system,sans-serif;max-width:100vw;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c10;--surf:#111318;--card:#161a22;--bord:#1e2330;--acc:#00e5a0;--warn:#ff6b35;--dang:#ff3b5c;--gold:#ffc94a;--blue:#4d9fff;--purple:#c77dff;--text:#e2e8f0;--sub:#64748b;--sub2:#94a3b8}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.fi{animation:fadeIn .3s ease}
input,select,button,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bord);border-radius:99px}

/* Layout */
#app{min-height:100vh;padding-bottom:70px;background:var(--bg)}

/* Header */
.header{background:rgba(10,12,16,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bord);padding:0 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;color:var(--acc);letter-spacing:-.5px}
.logo-dot{width:8px;height:8px;background:var(--acc);border-radius:50%;box-shadow:0 0 8px var(--acc)}
.header-actions{display:flex;align-items:center;gap:6px}
.icon-btn{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:7px 10px;color:var(--sub2);font-size:14px;line-height:1;transition:all .2s}
.icon-btn:active{transform:scale(.95)}
.month-nav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:4px 8px}
.month-nav button{background:none;border:none;color:var(--sub2);font-size:20px;padding:0 2px;line-height:1}
.month-nav span{font-weight:700;font-size:12px;min-width:78px;text-align:center;color:var(--text)}

/* Bottom Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,19,24,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bord);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:none;border-top:2px solid transparent;padding:8px 0 6px;color:var(--sub);font-size:9px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;letter-spacing:.3px}
.nav button.act{color:var(--acc);border-top-color:var(--acc)}
.nav button .ico{font-size:20px;transition:transform .2s}
.nav button.act .ico{transform:scale(1.1)}

/* Content */
.content{padding:14px 14px 0}

/* Cards */
.card{background:var(--card);border:1px solid var(--bord);border-radius:18px;padding:16px;margin-bottom:12px}
.card-sm{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:13px}
.glow-acc{box-shadow:0 0 24px rgba(0,229,160,.1);border-color:rgba(0,229,160,.2)}
.glow-gold{box-shadow:0 0 24px rgba(255,201,74,.1);border-color:rgba(255,201,74,.2)}
.glow-blue{box-shadow:0 0 24px rgba(77,159,255,.1);border-color:rgba(77,159,255,.2)}
.glow-dang{box-shadow:0 0 24px rgba(255,59,92,.1);border-color:rgba(255,59,92,.2)}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kpi-color,var(--acc))}
.kpi .lbl{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.kpi .val{font-size:19px;font-weight:800;letter-spacing:-.5px;color:var(--kpi-color,var(--text))}
.kpi .sub{font-size:10px;color:var(--sub);margin-top:3px}
.kpi .ico{position:absolute;right:12px;top:12px;font-size:22px;opacity:.25}

/* Progress bar */
.pbar{height:6px;border-radius:99px;background:var(--bord);overflow:hidden}
.pbar .fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}

/* Subtabs */
.subtabs{display:flex;background:var(--surf);border-radius:13px;padding:4px;border:1px solid var(--bord);margin-bottom:14px;gap:3px}
.subtabs button{flex:1;background:none;border:1px solid transparent;border-radius:10px;padding:9px 8px;color:var(--sub);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.subtabs button.act{background:var(--card);border-color:var(--bord);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cnt{border-radius:99px;padding:1px 6px;font-size:10px;font-weight:800}

/* Section header */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head .title{font-weight:800;font-size:16px;letter-spacing:-.3px}
.sec-head .sub{color:var(--sub);font-size:12px;margin-top:2px}
.btn-sm{border:none;border-radius:11px;padding:9px 18px;font-weight:700;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .2s}
.btn-sm:active{transform:scale(.96)}

/* Day group header */
.day-header{display:flex;align-items:center;gap:10px;padding:10px 0 6px;margin-top:4px}
.day-header .date-pill{background:var(--surf);border:1px solid var(--bord);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:700;color:var(--sub2)}
.day-header .day-total{font-size:11px;color:var(--sub);margin-left:auto}
.day-header .day-income{font-size:11px;color:var(--acc);font-weight:600}

/* Transaction row - IMPROVED */
.txn{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;border:1px solid var(--bord);transition:all .2s}
.txn:active{transform:scale(.98);background:var(--surf)}
.txn .txn-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.txn .txn-body{flex:1;min-width:0}
.txn .txn-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.txn .txn-meta{font-size:11px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn .txn-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.txn .txn-amt{font-weight:800;font-size:15px;letter-spacing:-.3px}
.txn .txn-acc{font-size:10px;color:var(--sub);background:var(--surf);border-radius:5px;padding:1px 6px}
.txn .txn-actions{display:flex;gap:4px;margin-top:4px}
.txn .txn-btn{background:none;border:1px solid var(--bord);border-radius:7px;padding:4px 8px;font-size:12px;color:var(--sub)}

/* Toast */
.toast{position:fixed;bottom:76px;left:14px;right:14px;z-index:800;border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;animation:slideUp .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.warn{background:#1a0f00;border:1px solid rgba(255,107,53,.4);color:var(--warn)}
.toast.danger{background:#1a000a;border:1px solid rgba(255,59,92,.4);color:var(--dang)}
.toast.success{background:#001a10;border:1px solid rgba(0,229,160,.4);color:var(--acc)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:600;padding:0}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:480px;animation:slideUp .3s ease;max-height:92vh;overflow-y:auto;border:1px solid var(--bord);border-bottom:none}
.modal-pill{width:40px;height:4px;background:var(--bord);border-radius:99px;margin:0 auto 20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-weight:800;font-size:17px;letter-spacing:-.3px}
.modal-close{background:var(--surf);border:1px solid var(--bord);border-radius:99px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:16px}
.flabel{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.finput{width:100%;background:var(--surf);border:1.5px solid var(--bord);border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;transition:border-color .2s}
.finput:focus{border-color:var(--acc)}
.fselect{width:100%;background:var(--surf);border:1.5px solid var(--bord);border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit}
.fgroup{margin-bottom:16px}
.btn-primary{width:100%;border:none;border-radius:14px;padding:14px;font-weight:800;font-size:15px;font-family:inherit;transition:all .2s}
.btn-primary:active{transform:scale(.98)}
.btn-cancel{width:100%;background:var(--surf);border:1.5px solid var(--bord);border-radius:14px;padding:14px;color:var(--sub);font-weight:700;font-size:15px;font-family:inherit}
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn-row .btn-primary,.btn-row .btn-cancel{flex:1}

/* Amount input big */
.amt-input-wrap{display:flex;align-items:center;gap:10px;background:var(--surf);border:1.5px solid var(--bord);border-radius:12px;padding:12px 14px;transition:border-color .2s}
.amt-input-wrap:focus-within{border-color:var(--acc)}
.amt-input-wrap .sym{font-size:22px;font-weight:800;color:var(--acc)}
.amt-input-wrap input{background:none;border:none;font-size:24px;font-weight:800;color:var(--text);width:100%;font-family:inherit;letter-spacing:-.5px}
.calc-toggle{background:var(--card);border:1.5px solid var(--bord);border-radius:11px;padding:10px 13px;color:var(--acc);font-weight:800;font-size:18px;transition:all .2s;flex-shrink:0}

/* Calculator */
.calc-wrap{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:12px;margin-top:10px}
.calc-display{font-size:24px;font-weight:800;color:var(--acc);text-align:right;padding:6px 8px;min-height:40px;letter-spacing:-.5px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.calc-btn{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:12px;font-size:16px;font-weight:700;color:var(--text);font-family:inherit;transition:all .15s}
.calc-btn:active{transform:scale(.92)}
.calc-btn.op{color:var(--acc);background:rgba(0,229,160,.08)}
.calc-btn.eq{background:var(--acc);color:#000;border-color:var(--acc)}
.calc-btn.clr{color:var(--dang);background:rgba(255,59,92,.08)}
.calc-use{width:100%;margin-top:8px;background:rgba(77,159,255,.12);border:1px solid rgba(77,159,255,.3);border-radius:11px;padding:10px;color:var(--blue);font-weight:700;font-size:13px;font-family:inherit}

/* Charts */
.chart-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chart-filter-row::-webkit-scrollbar{display:none}
.filter-chip{background:var(--card);border:1.5px solid var(--bord);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap;transition:all .2s;flex-shrink:0}
.filter-chip.act{background:rgba(0,229,160,.12);border-color:rgba(0,229,160,.4);color:var(--acc)}

/* Recurring badge */
.rec-badge{display:inline-flex;align-items:center;gap:2px;background:rgba(77,159,255,.15);border:1px solid rgba(77,159,255,.3);color:var(--blue);border-radius:5px;padding:1px 6px;font-size:9px;font-weight:700}

/* Empty state */
.empty{text-align:center;padding:36px 16px}
.empty .ico{font-size:44px;margin-bottom:12px}
.empty .t{font-weight:700;font-size:15px;margin-bottom:6px}
.empty .s{color:var(--sub);font-size:13px;line-height:1.5}

/* Account pill */
.acc-pill{border-radius:9px;padding:4px 10px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}

/* Summary stat row */
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bord);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row .sl{color:var(--sub)}
.stat-row .sv{font-weight:700}

/* Bar chart */
.cbar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cbar-label{font-size:11px;color:var(--sub);width:88px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar-track{flex:1;height:16px;background:var(--bord);border-radius:99px;overflow:hidden;position:relative}
.cbar-bg{position:absolute;top:0;left:0;height:100%;border-radius:99px;opacity:.2}
.cbar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.cbar-val{font-size:11px;font-weight:700;width:68px;text-align:right;flex-shrink:0}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:14px}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:6px;cursor:pointer}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Trend bars */
.trend-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.trend-bars{display:flex;gap:3px;align-items:flex-end;height:70px}
.trend-bar{width:12px;border-radius:4px 4px 0 0;min-height:2px}
.trend-lbl{font-size:9px;color:var(--sub)}

/* Alert strip */
.alert-strip{border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px;font-weight:500}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bord);border-radius:99px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--acc)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Storage ──
const S={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};

// ── Constants ──
const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DAYS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DEF_INC_CATS=["Salario","Freelance","Inversiones","Alquiler","Pensión","Bono","Otros"];
const ACC_TYPES=["Corriente","Ahorro","Inversión","Efectivo","Crypto","Otro"];
const REC_FREQ=["Semanal","Quincenal","Mensual","Bimestral","Trimestral","Anual"];
const PAL=["#00e5a0","#4d9fff","#ffc94a","#ff6b35","#c77dff","#ff3b5c","#00d4ff","#a8ff78","#f7971e","#12c2e9","#fb5607","#8338ec"];
const ACOLS=["#4d9fff","#00e5a0","#ffc94a","#c77dff","#ff6b35","#ff3b5c","#12c2e9","#a8ff78"];
const DEF_CATS=[
  {id:"vivienda",name:"Vivienda",icon:"🏠",fixed:true,budget:1200,color:PAL[0]},
  {id:"alimentacion",name:"Alimentación",icon:"🛒",fixed:false,budget:400,color:PAL[1]},
  {id:"transporte",name:"Transporte",icon:"🚗",fixed:false,budget:200,color:PAL[2]},
  {id:"salud",name:"Salud",icon:"💊",fixed:true,budget:150,color:PAL[3]},
  {id:"educacion",name:"Educación",icon:"📚",fixed:true,budget:100,color:PAL[4]},
  {id:"ocio",name:"Ocio",icon:"🎮",fixed:false,budget:150,color:PAL[5]},
  {id:"ropa",name:"Ropa",icon:"👗",fixed:false,budget:100,color:PAL[6]},
  {id:"suscripciones",name:"Suscripciones",icon:"📱",fixed:true,budget:80,color:PAL[7]},
  {id:"restaurantes",name:"Restaurantes",icon:"🍽",fixed:false,budget:200,color:PAL[8]},
  {id:"otros",name:"Otros",icon:"💼",fixed:false,budget:100,color:PAL[9]},
];

const fmt=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const pct=(a,b)=>b===0?0:Math.min(Math.round(a/b*100),999);
const mk=(y,m)=>`${y}-${String(m+1).padStart(2,"0")}`;
const today=()=>new Date().toISOString().slice(0,10);
const clamp=(v,mn,mx)=>Math.min(Math.max(v,mn),mx);
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const h2r=(hex,a=1)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;};
const pc=p=>p>=100?"#ff3b5c":p>=80?"#ff6b35":"#00e5a0";

// ── State ──
let ST={
  tab:"home",sub2:"gastos",chartFilter:"all",chartType:"bar",
  yr:new Date().getFullYear(),mo:new Date().getMonth(),
  cats:S.get("ft_cats",DEF_CATS),
  exps:S.get("ft_exps",{}),
  incs:S.get("ft_incs",{}),
  accs:S.get("ft_accs",[]),
  goal:S.get("ft_goal",500),
  incCats:S.get("ft_inccats",DEF_INC_CATS),
  recurring:S.get("ft_recurring",[]),
  transfers:S.get("ft_transfers",[]),
  modal:null,toast:null,toastTimer:null,
  aiRes:null,aiLoad:false,
};

function D(){
  const{yr,mo,cats,exps,incs,accs,goal}=ST;
  const key=mk(yr,mo);
  const mExps=exps[key]||[];
  const mIncs=incs[key]||[];
  const mIncome=mIncs.reduce((a,i)=>a+i.amount,0);
  const mSpent=mExps.reduce((a,e)=>a+e.amount,0);
  const mBudget=cats.reduce((a,c)=>a+c.budget,0);
  const mSaved=mIncome-mSpent;
  const mRate=mIncome>0?Math.round(mSaved/mIncome*100):0;
  const catT=cats.map(c=>({...c,spent:mExps.filter(e=>e.catId===c.id).reduce((a,e)=>a+e.amount,0)}));
  const totalBal=accs.reduce((a,c)=>a+c.balance,0);
  const alerts=catT.filter(c=>pct(c.spent,c.budget)>=90&&c.spent>0);
  const k6=Array.from({length:6},(_,i)=>{const d=new Date(yr,mo-5+i);return{lbl:MONTHS[d.getMonth()].slice(0,3),k:mk(d.getFullYear(),d.getMonth())};});
  const incPie=mIncs.reduce((acc,i)=>{const x=acc.find(a=>a.name===i.category);if(x)x.v+=i.amount;else acc.push({name:i.category||"Otros",v:i.amount,color:PAL[acc.length%PAL.length]});return acc;},[]);
  return{key,mExps,mIncs,mIncome,mSpent,mBudget,mSaved,mRate,catT,totalBal,alerts,k6,incPie};
}

function mut(fn){fn(ST);render();}
function save(){S.set("ft_cats",ST.cats);S.set("ft_exps",ST.exps);S.set("ft_incs",ST.incs);S.set("ft_accs",ST.accs);S.set("ft_goal",ST.goal);S.set("ft_inccats",ST.incCats);S.set("ft_recurring",ST.recurring);S.set("ft_transfers",ST.transfers||[]);}
function toast(msg,type="success"){if(ST.toastTimer)clearTimeout(ST.toastTimer);ST.toast={msg,type};ST.toastTimer=setTimeout(()=>{ST.toast=null;render();},2500);render();}

// ── Export/Import ──
function exportData(){
  const data={v:2,exported:new Date().toISOString(),...ST};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=`FinTrack_${today()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast("✅ Backup descargado");
}
function importData(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.cats||!d.exps)throw new Error();
      mut(s=>{Object.assign(s,{cats:d.cats||DEF_CATS,exps:d.exps||{},incs:d.incs||{},accs:d.accs||[],goal:d.goal||500,incCats:d.incCats||DEF_INC_CATS,recurring:d.recurring||[],transfers:d.transfers||[],modal:null});save();});
      toast("✅ Datos restaurados");
    }catch{toast("❌ Archivo inválido","danger");}
  };r.readAsText(file);
}

// ── HTML helpers ──
const pbar=(val,max)=>{const p=pct(val,max),c=pc(p);return`<div class="pbar"><div class="fill" style="width:${Math.min(p,100)}%;background:${c}"></div></div>`;};
const badge=(t,color)=>`<span class="badge" style="background:${h2r(color,.15)};color:${color};border:1px solid ${h2r(color,.3)}">${t}</span>`;

function donut(items){
  const total=items.reduce((a,i)=>a+i.v,0);
  if(!total)return`<div class="empty" style="padding:20px"><div class="ico">📊</div><div class="s">Sin datos aún</div></div>`;
  let cum=0;const r=38,cx=50,cy=50,sw=16,circ=2*Math.PI*r;
  const segs=items.map(item=>{const f=item.v/total,dash=f*circ,gap=circ-dash,off=circ-cum*circ;cum+=f;return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${item.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;}).join("");
  const legend=items.map(i=>`<div class="legend-item"><div class="legend-dot" style="background:${i.color}"></div><span style="flex:1;color:var(--sub2);font-size:12px">${i.name}</span><span style="font-weight:700;color:${i.color};font-size:12px">${fmt(i.v)}</span></div>`).join("");
  return`<div class="donut-wrap"><svg width="100" height="100" viewBox="0 0 100 100" style="flex-shrink:0">${segs}<text x="50" y="53" text-anchor="middle" fill="#e2e8f0" font-size="8" font-weight="800">${fmt(total)}</text></svg><div style="flex:1;overflow:hidden">${legend}</div></div>`;
}

function cssBar(items){
  const max=Math.max(...items.map(i=>Math.max(i.val,i.budget||0)),1);
  return items.map(i=>{
    const wp=clamp(i.val/max*100,0,100),bp=i.budget?clamp(i.budget/max*100,0,100):0;
    const c=pc(pct(i.val,i.budget||i.val));
    return`<div class="cbar-row"><div class="cbar-label" title="${i.label}">${i.label}</div><div class="cbar-track">${i.budget?`<div class="cbar-bg" style="width:${bp}%;background:${i.color}"></div>`:""}<div class="cbar-fill" style="width:${wp}%;background:${c}"></div></div><div class="cbar-val" style="color:${c}">${fmt(i.val)}</div></div>`;
  }).join("");
}

function trendChart(k6,exps,incs){
  const data=k6.map(({lbl,k})=>({lbl,g:(exps[k]||[]).reduce((a,e)=>a+e.amount,0),i:(incs[k]||[]).reduce((a,e)=>a+e.amount,0)}));
  const maxV=Math.max(...data.map(d=>Math.max(d.g,d.i)),1);
  const cols=data.map(d=>{
    const hI=clamp(d.i/maxV*70,2,70),hG=clamp(d.g/maxV*70,2,70);
    return`<div class="trend-col"><div class="trend-bars"><div class="trend-bar" style="height:${hI}px;background:var(--acc)" title="${fmt(d.i)}"></div><div class="trend-bar" style="height:${hG}px;background:var(--warn)" title="${fmt(d.g)}"></div></div><div class="trend-lbl">${d.lbl}</div></div>`;
  }).join("");
  return`<div>
    <div style="display:flex;gap:12px;margin-bottom:10px">
      <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub2)"><span style="width:10px;height:10px;background:var(--acc);border-radius:3px;display:inline-block"></span>Ingreso</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub2)"><span style="width:10px;height:10px;background:var(--warn);border-radius:3px;display:inline-block"></span>Gasto</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:4px;height:80px">${cols}</div>
  </div>`;
}

// ── Group transactions by date ──
function groupByDate(items){
  const groups={};
  items.forEach(item=>{
    const d=item.date||today();
    if(!groups[d])groups[d]=[];
    groups[d].push(item);
  });
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));
}

function formatDate(dateStr){
  const d=new Date(dateStr+"T12:00:00");
  const t=new Date();
  const y=new Date(t);y.setDate(t.getDate()-1);
  if(dateStr===today())return"Hoy";
  if(dateStr===y.toISOString().slice(0,10))return"Ayer";
  return`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
}

// ── Build app ──
function buildApp(d){
  const{key,mExps,mIncs,mIncome,mSpent,mBudget,mSaved,mRate,catT,totalBal,alerts,k6,incPie}=d;
  const{tab,sub2,yr,mo,cats,exps,incs,accs,goal,modal,toast:t,aiRes,aiLoad,transfers}=ST;

  // Modal routing
  let mHtml="";
  if(modal==="exp")mHtml=modalExp();
  else if(modal==="inc")mHtml=modalInc();
  else if(modal==="acc")mHtml=modalAcc(null);
  else if(modal==="goal")mHtml=modalGoal();
  else if(modal==="backup")mHtml=modalBackup();
  else if(modal==="transfer")mHtml=modalTransfer();
  else if(modal==="add-cat-exp")mHtml=modalAddCat("exp");
  else if(modal==="add-cat-inc")mHtml=modalAddCat("inc");
  else if(modal?.startsWith("edit-exp-")){const id=modal.replace("edit-exp-","");const it=mExps.find(e=>String(e.id)===id);if(it)mHtml=modalExp(it);}
  else if(modal?.startsWith("edit-inc-")){const id=modal.replace("edit-inc-","");const it=mIncs.find(i=>String(i.id)===id);if(it)mHtml=modalInc(it);}
  else if(modal?.startsWith("edit-acc-")){const id=+modal.replace("edit-acc-","");const ac=accs.find(a=>a.id===id);if(ac)mHtml=modalAcc(ac);}

  const toastHtml=t?`<div class="toast ${t.type}">${t.msg}<button id="close-toast" style="background:none;border:none;color:inherit;font-size:18px;margin-left:auto;padding:0">×</button></div>`:"";

  const TABS=[{id:"home",ico:"📊",lbl:"Inicio"},{id:"movimientos",ico:"💸",lbl:"Movimientos"},{id:"cuentas",ico:"🏦",lbl:"Cuentas"},{id:"charts",ico:"📈",lbl:"Gráficos"},{id:"ia",ico:"🤖",lbl:"IA"}];
  const nav=`<nav class="nav">${TABS.map(tb=>`<button class="${tab===tb.id?"act":""}" data-tab="${tb.id}"><span class="ico">${tb.ico}</span>${tb.lbl}</button>`).join("")}</nav>`;
  const header=`<div class="header">
    <div class="logo"><div class="logo-dot"></div>FinTrack</div>
    <div class="header-actions">
      <button class="icon-btn" id="open-backup">💾</button>
      <button class="icon-btn" id="open-recurring">🔄</button>
      <div class="month-nav">
        <button id="prev-mo">‹</button>
        <span>${MONTHS[mo].slice(0,3)} ${yr}</span>
        <button id="next-mo">›</button>
      </div>
    </div>
  </div>`;

  let page="";

  // ── HOME ──
  if(tab==="home"){
    const gPct=clamp(pct(Math.max(mSaved,0),goal),0,100);
    const gCol=mSaved>=goal?"var(--acc)":"var(--gold)";
    const alertsHtml=alerts.length>0?`<div style="margin-bottom:12px">${alerts.map(a=>{const p2=pct(a.spent,a.budget),col=p2>=100?"var(--dang)":"var(--warn)";return`<div class="alert-strip" style="background:${h2r(p2>=100?"#ff3b5c":"#ff6b35",.08)};border:1px solid ${h2r(p2>=100?"#ff3b5c":"#ff6b35",.25)};color:${col}"><span>${a.icon}</span><span style="flex:1">${a.name}: ${fmt(a.spent)} / ${fmt(a.budget)}</span><span style="background:${h2r(p2>=100?"#ff3b5c":"#ff6b35",.2)};border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800">${p2>=100?"EXCEDIDO":"ALERTA"}</span></div>`;}).join("")}</div>`:"";

    page=`
      <div class="kpi-grid">
        <div class="kpi" style="--kpi-color:var(--acc)"><div class="lbl">Ingresos</div><div class="val">${fmt(mIncome)}</div><div class="ico">💵</div></div>
        <div class="kpi" style="--kpi-color:${mSpent>mBudget?"var(--dang)":"var(--warn)"}"><div class="lbl">Gastos</div><div class="val">${fmt(mSpent)}</div><div class="sub">de ${fmt(mBudget)}</div><div class="ico">💸</div></div>
        <div class="kpi" style="--kpi-color:${mSaved>=0?"var(--acc)":"var(--dang)"}"><div class="lbl">Disponible</div><div class="val">${fmt(mIncome-mSpent)}</div><div class="ico">🏦</div></div>
        <div class="kpi" style="--kpi-color:${mRate>=20?"var(--acc)":mRate>=10?"var(--gold)":"var(--dang)"}"><div class="lbl">Ahorro</div><div class="val">${mRate}%</div><div class="sub">Meta: ${fmt(goal)}</div><div class="ico">🎯</div></div>
      </div>

      ${accs.length>0?`<div class="card glow-blue">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div><div style="font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.8px;text-transform:uppercase">Patrimonio Total</div><div style="font-size:22px;font-weight:800;color:${totalBal>=0?"var(--blue)":"var(--dang)"};letter-spacing:-.5px">${fmt(totalBal)}</div></div>
          <span style="font-size:28px;opacity:.3">🏦</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${accs.map(a=>`<div class="acc-pill" style="background:${h2r(a.color,.12)};border:1px solid ${h2r(a.color,.3)}"><span style="color:var(--sub2)">${a.name.slice(0,12)}</span><span style="font-weight:800;color:${a.balance>=0?a.color:"var(--dang)"}">${fmt(a.balance)}</span></div>`).join("")}</div>
      </div>`:""}

      <div class="card ${mSaved>=goal?"glow-acc":"glow-gold"}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-weight:700;font-size:14px">🎯 Meta de Ahorro</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-weight:800;color:${gCol};font-size:13px">${fmt(Math.max(mSaved,0))} / ${fmt(goal)}</span>
            <button id="open-goal" class="icon-btn" style="padding:5px 8px;font-size:12px">✏️</button>
          </div>
        </div>
        <div class="pbar"><div class="fill" style="width:${gPct}%;background:${gCol}"></div></div>
        <div style="margin-top:6px;font-size:11px;color:var(--sub)">${mSaved>=goal?`✅ ¡Meta alcanzada! Superávit ${fmt(mSaved-goal)}`:`Faltan ${fmt(goal-Math.max(mSaved,0))} para tu meta`}</div>
      </div>

      ${alertsHtml}

      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:12px">📈 Tendencia 6 Meses</div>
        ${trendChart(k6,exps,incs)}
      </div>

      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:12px">🍩 Distribución de Gastos</div>
        ${donut(catT.filter(c=>c.spent>0).map(c=>({name:c.name,v:c.spent,color:c.color})))}
      </div>
    `;
  }

  // ── MOVIMIENTOS ──
  else if(tab==="movimientos"){
    const subTabs=`<div class="subtabs">
      <button class="${sub2==="gastos"?"act":""}" data-sub="gastos">💸 Gastos <span class="cnt" style="background:${sub2==="gastos"?"rgba(0,229,160,.15)":"var(--surf)"};color:${sub2==="gastos"?"var(--acc)":"var(--sub)"}">${mExps.length}</span></button>
      <button class="${sub2==="ingresos"?"act":""}" data-sub="ingresos">💵 Ingresos <span class="cnt" style="background:${sub2==="ingresos"?"rgba(0,229,160,.15)":"var(--surf)"};color:${sub2==="ingresos"?"var(--acc)":"var(--sub)"}">${mIncs.length}</span></button>
    </div>`;

    if(sub2==="gastos"){
      const grouped=groupByDate(mExps);
      const rows=grouped.length===0?`<div class="empty"><div class="ico">💸</div><div class="t">Sin gastos este mes</div><div class="s">Toca el botón + para registrar tu primer gasto</div></div>`:grouped.map(([date,items])=>{
        const dayTotal=items.reduce((a,e)=>a+e.amount,0);
        return`<div class="day-header"><div class="date-pill">${formatDate(date)}</div><div class="day-total">-${fmt(dayTotal)}</div></div>${items.map(e=>txnRow(e,"exp",cats,accs)).join("")}`;
      }).join("");
      page=`${subTabs}
        <div class="sec-head"><div><div class="title">Gastos</div><div class="sub">${MONTHS[mo]} · Total ${fmt(mSpent)}</div></div><button class="btn-sm" id="open-exp" style="background:var(--acc);color:#000">+ Añadir</button></div>
        ${rows}`;
    } else {
      const grouped=groupByDate(mIncs);
      const rows=grouped.length===0?`<div class="empty"><div class="ico">💵</div><div class="t">Sin ingresos este mes</div><div class="s">Toca el botón + para registrar un ingreso</div></div>`:grouped.map(([date,items])=>{
        const dayTotal=items.reduce((a,e)=>a+e.amount,0);
        return`<div class="day-header"><div class="date-pill">${formatDate(date)}</div><div class="day-income">+${fmt(dayTotal)}</div></div>${items.map(i=>txnRow(i,"inc",cats,accs)).join("")}`;
      }).join("");
      page=`${subTabs}
        <div class="sec-head"><div><div class="title">Ingresos</div><div class="sub">${MONTHS[mo]} · Total ${fmt(mIncome)}</div></div><button class="btn-sm" id="open-inc" style="background:var(--acc);color:#000">+ Añadir</button></div>
        ${rows}`;
    }
  }

  // ── CUENTAS ──
  else if(tab==="cuentas"){
    const trfs=transfers||[];
    page=`
      <div class="sec-head"><div><div class="title">Cuentas</div><div class="sub">Patrimonio: ${fmt(totalBal)}</div></div>
        <div style="display:flex;gap:8px"><button class="btn-sm" id="open-transfer" style="background:var(--purple);color:#000">🔁</button><button class="btn-sm" id="open-acc" style="background:var(--blue);color:#000">+ Nueva</button></div>
      </div>

      ${accs.length>0?`<div class="card glow-blue" style="margin-bottom:12px">
        <div style="font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.8px;margin-bottom:4px">PATRIMONIO TOTAL</div>
        <div style="font-size:28px;font-weight:900;color:${totalBal>=0?"var(--blue)":"var(--dang)"};letter-spacing:-1px;margin-bottom:10px">${fmt(totalBal)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${accs.map(a=>`<div class="acc-pill" style="background:${h2r(a.color,.12)};border:1px solid ${h2r(a.color,.3)}"><span style="color:var(--sub2)">${a.name.slice(0,12)}</span><span style="font-weight:800;color:${a.balance>=0?a.color:"var(--dang)"}">${fmt(a.balance)}</span></div>`).join("")}</div>
      </div>`:""}

      ${accs.length===0?`<div class="empty"><div class="ico">🏦</div><div class="t">Sin cuentas aún</div><div class="s">Añade tus cuentas bancarias para ver tu patrimonio total</div></div>`:
      accs.map(a=>`<div class="card" style="border-color:${h2r(a.color,.2)};margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:${totalBal>0&&a.balance>0?"10px":"0"}">
          <div style="width:46px;height:46px;border-radius:14px;background:${h2r(a.color,.15)};border:1px solid ${h2r(a.color,.3)};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🏦</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:15px">${a.name}</div>
            ${(a.bank||a.type)?`<div style="color:var(--sub);font-size:12px;margin-top:2px">${[a.bank,a.type].filter(Boolean).join(" · ")}</div>`:""}
          </div>
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:900;color:${a.balance>=0?a.color:"var(--dang)"};letter-spacing:-.5px">${fmt(a.balance)}</div>
            <div style="font-size:10px;color:var(--sub)">saldo actual</div>
          </div>
        </div>
        ${totalBal>0&&a.balance>0?`<div style="margin-bottom:6px">${pbar(a.balance,totalBal)}</div><div style="font-size:10px;color:var(--sub);text-align:right">${Math.round(a.balance/totalBal*100)}% del patrimonio</div>`:""}
        <div style="display:flex;gap:8px;margin-top:10px">
          <button data-edit-acc="${a.id}" style="flex:1;background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:8px;color:var(--sub2);font-weight:600;font-size:13px;font-family:inherit">✏️ Editar</button>
          <button data-del-acc="${a.id}" style="background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.25);border-radius:10px;padding:8px 14px;color:var(--dang);font-weight:600;font-size:13px;font-family:inherit">🗑️</button>
        </div>
      </div>`).join("")}

      ${trfs.length>0?`<div class="card" style="margin-top:12px">
        <div style="font-weight:700;font-size:14px;margin-bottom:12px">🔁 Transferencias Recientes</div>
        ${trfs.slice(0,8).map(t=>{const f=accs.find(a=>a.id===t.fromId);const to=accs.find(a=>a.id===t.toId);return`<div class="txn"><div class="txn-icon" style="background:rgba(199,125,255,.15)">🔁</div><div class="txn-body"><div class="txn-name">${f?.name||"?"} → ${to?.name||"?"}</div><div class="txn-meta">${t.date}${t.notes?" · "+t.notes:""}</div></div><div class="txn-right"><div class="txn-amt" style="color:var(--purple)">${fmt(t.amount)}</div></div></div>`;}).join("")}
      </div>`:""}
    `;
  }

  // ── CHARTS ──
  else if(tab==="charts"){
    const allCats=["all",...cats.map(c=>c.id)];
    const cf=ST.chartFilter;

    // Filter data
    const filtExps=cf==="all"?mExps:mExps.filter(e=>e.catId===cf);
    const filtTotal=filtExps.reduce((a,e)=>a+e.amount,0);

    // Monthly trend data for all 6 months
    const trend6=k6.map(({lbl,k})=>({lbl,g:(exps[k]||[]).reduce((a,e)=>a+e.amount,0),i:(incs[k]||[]).reduce((a,e)=>a+e.amount,0)}));
    const maxTrend=Math.max(...trend6.map(d=>Math.max(d.g,d.i)),1);

    // Category comparison
    const catData=catT.filter(c=>c.budget>0||c.spent>0);
    const maxCat=Math.max(...catData.map(c=>Math.max(c.budget,c.spent)),1);

    // Day of week spending
    const dowSpend=[0,1,2,3,4,5,6].map(dow=>{
      const total=mExps.filter(e=>{const d=new Date((e.date||today())+"T12:00:00");return d.getDay()===dow;}).reduce((a,e)=>a+e.amount,0);
      return{lbl:DAYS[dow],total};
    });
    const maxDow=Math.max(...dowSpend.map(d=>d.total),1);

    page=`
      <div class="sec-head"><div><div class="title">Gráficos</div><div class="sub">${MONTHS[mo]} ${yr}</div></div></div>

      <!-- Category filter chips -->
      <div class="chart-filter-row">
        <button class="filter-chip ${cf==="all"?"act":""}" data-cf="all">Todas</button>
        ${cats.map(c=>`<button class="filter-chip ${cf===c.id?"act":""}" data-cf="${c.id}">${c.icon} ${c.name}</button>`).join("")}
      </div>

      <!-- Total filtered -->
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.8px">${cf==="all"?"TOTAL GASTOS":cats.find(c=>c.id===cf)?.name.toUpperCase()||"CATEGORÍA"}</div>
          <div style="font-size:26px;font-weight:900;color:var(--dang);letter-spacing:-1px;margin-top:3px">${fmt(filtTotal)}</div></div>
          <div style="text-align:right"><div style="font-size:11px;color:var(--sub)">${filtExps.length} transacciones</div>
          ${cf!=="all"?`<div style="font-size:11px;color:var(--sub);margin-top:2px">Presupuesto: ${fmt(cats.find(c=>c.id===cf)?.budget||0)}</div>`:""}
          </div>
        </div>
        ${cf!=="all"?`<div style="margin-top:10px">${pbar(filtTotal,cats.find(c=>c.id===cf)?.budget||filtTotal)}</div>`:""}
      </div>

      <!-- Donut de gastos -->
      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:12px">🍩 Distribución por Categoría</div>
        ${donut(catT.filter(c=>c.spent>0).map(c=>({name:c.name,v:c.spent,color:c.color})))}
      </div>

      <!-- Gasto vs Presupuesto -->
      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:14px">📊 Gasto vs Presupuesto</div>
        ${cssBar(catData.map(c=>({label:c.name,val:c.spent,budget:c.budget,color:c.color})))}
      </div>

      <!-- Tendencia 6 meses -->
      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:12px">📈 Tendencia 6 Meses</div>
        <div style="display:flex;align-items:flex-end;gap:5px;height:90px;margin-bottom:6px">
          ${trend6.map(d=>{
            const hI=clamp(d.i/maxTrend*78,2,78),hG=clamp(d.g/maxTrend*78,2,78);
            return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
              <div style="display:flex;gap:2px;align-items:flex-end;height:78px">
                <div style="width:13px;height:${hI}px;background:var(--acc);border-radius:4px 4px 0 0" title="${fmt(d.i)}"></div>
                <div style="width:13px;height:${hG}px;background:var(--warn);border-radius:4px 4px 0 0" title="${fmt(d.g)}"></div>
              </div>
              <div style="font-size:9px;color:var(--sub)">${d.lbl}</div>
            </div>`;
          }).join("")}
        </div>
        <div style="display:flex;gap:16px;margin-top:6px">
          <span style="font-size:11px;display:flex;align-items:center;gap:5px;color:var(--sub2)"><span style="width:10px;height:10px;background:var(--acc);border-radius:3px;display:inline-block"></span>Ingreso ${fmt(trend6[5]?.i||0)}</span>
          <span style="font-size:11px;display:flex;align-items:center;gap:5px;color:var(--sub2)"><span style="width:10px;height:10px;background:var(--warn);border-radius:3px;display:inline-block"></span>Gasto ${fmt(trend6[5]?.g||0)}</span>
        </div>
      </div>

      <!-- Gasto por día de la semana -->
      <div class="card">
        <div style="font-weight:700;font-size:14px;margin-bottom:12px">📅 Gasto por Día de la Semana</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:6px">
          ${dowSpend.map(d=>{
            const h=clamp(d.total/maxDow*68,2,68);
            return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
              <div style="width:100%;max-width:32px;height:${h}px;background:${d.total===Math.max(...dowSpend.map(x=>x.total))?"var(--dang)":"var(--blue)"};border-radius:6px 6px 0 0;opacity:${d.total===0?0.2:1}" title="${fmt(d.total)}"></div>
              <div style="font-size:10px;color:var(--sub)">${d.lbl}</div>
            </div>`;
          }).join("")}
        </div>
        <div style="font-size:11px;color:var(--sub);text-align:center">Día con más gasto: <span style="color:var(--dang);font-weight:700">${dowSpend.reduce((a,b)=>b.total>a.total?b:a).lbl}</span></div>
      </div>

      <!-- Ingresos pie -->
      ${incPie.length>0?`<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:12px">💵 Fuentes de Ingreso</div>${donut(incPie)}</div>`:""}
    `;
  }

  // ── PRESUPUESTO (Budget tab replaced with settings-like budget in movimientos) ──
  // Budget is now accessible from charts or we add it

  // ── IA ──
  else if(tab==="ia"){
    const mFixed=catT.filter(c=>c.fixed).reduce((a,c)=>a+c.spent,0);
    const mVar=catT.filter(c=>!c.fixed).reduce((a,c)=>a+c.spent,0);

    const aiContent=aiLoad?`<div class="empty"><div style="font-size:44px;animation:pulse 1s infinite">⚙️</div><div class="t">Analizando tus finanzas...</div><div class="s">Esto tarda unos segundos</div></div>`:
      aiRes&&!aiRes.error?`
        <div style="display:grid;grid-template-columns:auto 1fr;gap:12px;margin-bottom:12px">
          <div class="card ${aiRes.puntuacion>=70?"glow-acc":aiRes.puntuacion>=50?"glow-gold":"glow-dang"}" style="text-align:center;padding:18px;min-width:100px">
            <div style="font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.8px;margin-bottom:6px">PUNTUACIÓN</div>
            <div style="font-size:42px;font-weight:900;color:${aiRes.puntuacion>=70?"var(--acc)":aiRes.puntuacion>=50?"var(--gold)":"var(--dang)"};letter-spacing:-2px">${aiRes.puntuacion}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:2px">de 100</div>
          </div>
          <div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px">📝 Resumen</div><p style="color:var(--sub2);font-size:13px;line-height:1.6">${aiRes.resumen}</p>
            ${aiRes.alertas?.length?`<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">${aiRes.alertas.map(a=>`<div style="background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.3);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--warn)">⚠️ ${a}</div>`).join("")}</div>`:""}
          </div>
        </div>
        ${aiRes.categorias_reducir?.length?`<div class="card" style="margin-bottom:12px"><div style="font-weight:700;font-size:14px;margin-bottom:12px">✂️ Reduce Aquí</div>${aiRes.categorias_reducir.map(c=>`<div style="background:rgba(255,59,92,.08);border:1px solid rgba(255,59,92,.2);border-radius:12px;padding:13px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-weight:700;font-size:13px">${c.nombre}</span>${badge("Ahorro: "+fmt(c.potencial),"#00e5a0")}</div><p style="color:var(--sub2);font-size:12px;line-height:1.5">${c.sugerencia}</p></div>`).join("")}</div>`:""}
        ${aiRes.recomendaciones?.length?`<div class="card" style="margin-bottom:12px"><div style="font-weight:700;font-size:14px;margin-bottom:12px">💡 Recomendaciones</div>${aiRes.recomendaciones.map((r,i)=>`<div style="display:flex;gap:10px;padding:12px;background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.15);border-radius:12px;margin-bottom:8px"><div style="width:24px;height:24px;border-radius:50%;background:rgba(0,229,160,.15);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:800;font-size:11px;flex-shrink:0">${i+1}</div><div style="flex:1"><div style="font-weight:700;font-size:13px;margin-bottom:3px">${r.titulo}</div><p style="color:var(--sub2);font-size:12px;line-height:1.5">${r.detalle}</p></div></div>`).join("")}</div>`:""}
        ${aiRes.conclusion?`<div class="card glow-acc" style="border-left:3px solid var(--acc)"><div style="font-weight:700;font-size:13px;margin-bottom:6px">🎯 Conclusión</div><p style="color:var(--sub2);font-size:13px;line-height:1.6">${aiRes.conclusion}</p></div>`:""}
      `:aiRes?.error?`<div class="card" style="background:rgba(255,59,92,.08);text-align:center;padding:28px"><div style="color:var(--dang);font-weight:700;font-size:14px">${aiRes.error}</div></div>`:
      `<div class="empty"><div class="ico">🤖</div><div class="t">Análisis Inteligente</div><div class="s">Pulsa el botón para que la IA analice tus finanzas de ${MONTHS[mo]} y te dé recomendaciones personalizadas</div></div>`;

    page=`
      <div class="sec-head" style="margin-bottom:14px"><div><div class="title">Análisis IA</div><div class="sub">${MONTHS[mo]} ${yr}</div></div></div>

      <button id="run-ai" style="width:100%;background:${aiLoad?"var(--card)":"linear-gradient(135deg,#00e5a0,#00b4d8)"};color:#000;border:${aiLoad?"1px solid var(--bord)":"none"};border-radius:16px;padding:15px;font-weight:800;font-size:15px;font-family:inherit;margin-bottom:14px;letter-spacing:-.2px;opacity:${aiLoad?.6:1}">
        ${aiLoad?`<span style="animation:pulse 1s infinite;color:var(--sub)">⏳ Analizando...</span>`:"🤖 Analizar mis Finanzas"}
      </button>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div class="card-sm"><div style="font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.8px;margin-bottom:8px">RESUMEN</div>
          ${[{l:"Ingresos",v:fmt(mIncome),c:"var(--acc)"},{l:"Gastos",v:fmt(mSpent),c:mSpent>mIncome?"var(--dang)":"var(--warn)"},{l:"Fijos",v:fmt(mFixed),c:"var(--blue)"},{l:"Variables",v:fmt(mVar),c:"var(--gold)"},{l:"Ahorro",v:fmt(Math.max(mSaved,0)),c:"var(--acc)"},{l:"Tasa",v:mRate+"%",c:mRate>=20?"var(--acc)":mRate>=10?"var(--gold)":"var(--dang)"}].map(r=>`<div class="stat-row"><span class="sl">${r.l}</span><span class="sv" style="color:${r.c}">${r.v}</span></div>`).join("")}
        </div>
        <div class="card-sm"><div style="font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.8px;margin-bottom:8px">TOP GASTOS</div>
          ${[...catT].sort((a,b)=>b.spent-a.spent).slice(0,6).map((c,i)=>`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--sub);font-size:10px;width:14px;font-weight:700">${i+1}</span><span>${c.icon}</span><span style="flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span><span style="font-weight:700;font-size:11px;color:${pct(c.spent,c.budget)>100?"var(--dang)":"var(--text)"}">${fmt(c.spent)}</span></div>`).join("")}
        </div>
      </div>

      ${aiContent}
    `;
  }

  return`${toastHtml}${mHtml}<div id="app-inner">${header}<div class="content fi">${page}</div>${nav}</div>`;
}

// ── Calculator state ──
let CS={expr:"",display:"0"};

// ── Bind events ──
function bindEvents(d){
  const{key,mExps,mIncs}=d;

  // toast close
  document.getElementById("close-toast")?.addEventListener("click",()=>{if(ST.toastTimer)clearTimeout(ST.toastTimer);ST.toast=null;render();});

  // nav
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.tab=b.dataset.tab)));
  document.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.sub2=b.dataset.sub)));
  document.querySelectorAll("[data-cf]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.chartFilter=b.dataset.cf)));

  // month
  document.getElementById("prev-mo")?.addEventListener("click",()=>mut(s=>{const dd=new Date(s.yr,s.mo-1);s.yr=dd.getFullYear();s.mo=dd.getMonth();}));
  document.getElementById("next-mo")?.addEventListener("click",()=>mut(s=>{const dd=new Date(s.yr,s.mo+1);s.yr=dd.getFullYear();s.mo=dd.getMonth();}));

  // open modals
  const opens={"open-exp":"exp","open-inc":"inc","open-acc":"acc","open-goal":"goal","open-backup":"backup","open-transfer":"transfer","open-add-cat-exp":"add-cat-exp","open-recurring":"recurring"};
  Object.entries(opens).forEach(([id,modal])=>document.getElementById(id)?.addEventListener("click",()=>mut(s=>s.modal=modal)));

  // close modal
  ["cm","cm2"].forEach(id=>document.getElementById(id)?.addEventListener("click",()=>mut(s=>s.modal=null)));
  document.getElementById("overlay")?.addEventListener("click",e=>{if(e.target.id==="overlay")mut(s=>s.modal=null);});

  // recurring toggle
  document.getElementById("m-rec")?.addEventListener("change",e=>{const w=document.getElementById("rec-wrap");if(w)w.style.display=e.target.checked?"block":"none";});

  // calculator
  document.getElementById("toggle-calc")?.addEventListener("click",()=>{
    const a=document.getElementById("calc-area");if(!a)return;
    CS={expr:document.getElementById("m-amount")?.value||"",display:document.getElementById("m-amount")?.value||"0"};
    a.style.display=a.style.display==="none"?"block":"none";
  });
  document.querySelectorAll("[data-calc]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.calc;const disp=document.getElementById("calc-display");
    if(k==="C"){CS={expr:"",display:"0"};}
    else if(k==="="){try{const r=Function('"use strict";return ('+CS.expr.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-")+')')();CS.display=String(Math.round(r*100)/100);CS.expr=CS.display;}catch{CS.display="Error";CS.expr="";}}
    else if(["÷","×","−","+"].includes(k)){CS.expr+=k;CS.display=CS.expr;}
    else{CS.expr+=k;CS.display=CS.expr;}
    if(disp)disp.textContent=CS.display;
  }));
  document.getElementById("calc-sum")?.addEventListener("click",()=>{
    const inp=document.getElementById("m-amount");if(inp&&CS.display!=="Error")inp.value=CS.display;
    const a=document.getElementById("calc-area");if(a)a.style.display="none";
  });

  // save expense
  document.getElementById("save-exp")?.addEventListener("click",()=>{
    const desc=document.getElementById("m-desc")?.value.trim();
    const amount=parseFloat(document.getElementById("m-amount")?.value);
    const catId=document.getElementById("m-cat")?.value;
    const accId=document.getElementById("m-acc")?.value?+document.getElementById("m-acc")?.value:null;
    const date=document.getElementById("m-date")?.value||today();
    const recurring=document.getElementById("m-rec")?.checked||false;
    const freq=document.getElementById("m-freq")?.value||"Mensual";
    const notes=document.getElementById("m-notes")?.value.trim()||"";
    const btn=document.getElementById("save-exp");
    const editId=btn?.dataset.id;const oldAccId=btn?.dataset.oa?+btn.dataset.oa:null;const oldAmt=parseFloat(btn?.dataset.oamt)||0;
    if(!desc||isNaN(amount)||amount<=0){toast("⚠️ Completa descripción e importe","warn");return;}
    mut(s=>{
      const item={id:editId?+editId:uid(),desc,amount,catId,accId,date,recurring,freq,notes};
      if(editId){
        s.exps={...s.exps,[key]:(s.exps[key]||[]).map(e=>String(e.id)===String(editId)?item:e)};
        if(oldAccId)s.accs=s.accs.map(a=>a.id===oldAccId?{...a,balance:Math.round((a.balance+oldAmt)*100)/100}:a);
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance-amount)*100)/100}:a);
      } else {
        s.exps={...s.exps,[key]:[...(s.exps[key]||[]),item]};
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance-amount)*100)/100}:a);
      }
      if(recurring&&!s.recurring.find(r=>r.id===item.id))s.recurring=[...s.recurring,item];
      s.modal=null;save();
    });
    toast(editId?"✅ Gasto actualizado":"✅ Gasto guardado");
  });

  // save income
  document.getElementById("save-inc")?.addEventListener("click",()=>{
    const desc=document.getElementById("m-desc")?.value.trim();
    const amount=parseFloat(document.getElementById("m-amount")?.value);
    const category=document.getElementById("m-cat")?.value;
    const accId=document.getElementById("m-acc")?.value?+document.getElementById("m-acc")?.value:null;
    const date=document.getElementById("m-date")?.value||today();
    const recurring=document.getElementById("m-rec")?.checked||false;
    const freq=document.getElementById("m-freq")?.value||"Mensual";
    const btn=document.getElementById("save-inc");
    const editId=btn?.dataset.id;const oldAccId=btn?.dataset.oa?+btn.dataset.oa:null;const oldAmt=parseFloat(btn?.dataset.oamt)||0;
    if(!desc||isNaN(amount)||amount<=0){toast("⚠️ Completa descripción e importe","warn");return;}
    mut(s=>{
      const item={id:editId?+editId:uid(),desc,amount,category,accId,date,recurring,freq};
      if(editId){
        s.incs={...s.incs,[key]:(s.incs[key]||[]).map(i=>String(i.id)===String(editId)?item:i)};
        if(oldAccId)s.accs=s.accs.map(a=>a.id===oldAccId?{...a,balance:Math.round((a.balance-oldAmt)*100)/100}:a);
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance+amount)*100)/100}:a);
      } else {
        s.incs={...s.incs,[key]:[...(s.incs[key]||[]),item]};
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance+amount)*100)/100}:a);
      }
      s.modal=null;save();
    });
    toast(editId?"✅ Ingreso actualizado":"✅ Ingreso guardado");
  });

  // save account
  document.getElementById("save-acc")?.addEventListener("click",()=>{
    const name=document.getElementById("m-name")?.value.trim();
    const bank=document.getElementById("m-bank")?.value.trim();
    const type=document.getElementById("m-type")?.value;
    const balance=parseFloat(document.getElementById("m-balance")?.value);
    if(!name||isNaN(balance)){toast("⚠️ Completa nombre y saldo","warn");return;}
    const editId=ST.modal?.startsWith("edit-acc-")?+ST.modal.replace("edit-acc-",""):null;
    mut(s=>{
      if(editId){s.accs=s.accs.map(a=>a.id===editId?{...a,name,bank,type,balance}:a);}
      else{s.accs=[...s.accs,{id:uid(),name,bank,type,balance,color:ACOLS[s.accs.length%ACOLS.length]}];}
      s.modal=null;save();
    });
    toast(editId?"✅ Cuenta actualizada":"✅ Cuenta añadida");
  });

  // save goal
  document.getElementById("save-goal")?.addEventListener("click",()=>{
    const v=parseFloat(document.getElementById("m-goal")?.value);
    if(v>0)mut(s=>{s.goal=v;s.modal=null;save();});
    else mut(s=>s.modal=null);
  });

  // save transfer
  document.getElementById("save-transfer")?.addEventListener("click",()=>{
    const amount=parseFloat(document.getElementById("t-amount")?.value);
    const fromId=+document.getElementById("t-from")?.value;
    const toId=+document.getElementById("t-to")?.value;
    const date=document.getElementById("t-date")?.value||today();
    const notes=document.getElementById("t-notes")?.value.trim()||"";
    if(!amount||amount<=0){toast("⚠️ Ingresa un importe","warn");return;}
    if(fromId===toId){toast("⚠️ Elige cuentas distintas","warn");return;}
    mut(s=>{
      s.accs=s.accs.map(a=>{
        if(a.id===fromId)return{...a,balance:Math.round((a.balance-amount)*100)/100};
        if(a.id===toId)return{...a,balance:Math.round((a.balance+amount)*100)/100};
        return a;
      });
      s.transfers=[{id:uid(),fromId,toId,amount,date,notes},...(s.transfers||[])];
      s.modal=null;save();
    });
    toast("✅ Transferencia realizada");
  });

  // save custom category
  document.getElementById("save-cat")?.addEventListener("click",()=>{
    const type=document.getElementById("save-cat")?.dataset.type;
    const name=document.getElementById("m-catname")?.value.trim();
    if(!name){toast("⚠️ Escribe un nombre","warn");return;}
    if(type==="inc"){
      mut(s=>{s.incCats=[...s.incCats,name];s.modal=null;save();});
    } else {
      const icon=document.getElementById("m-caticon")?.value||"💼";
      const budget=parseFloat(document.getElementById("m-catbudget")?.value)||0;
      const fixed=document.querySelector('input[name="cattype"]:checked')?.value==="fixed";
      mut(s=>{s.cats=[...s.cats,{id:"cat_"+Date.now(),name,icon,fixed,budget,color:PAL[s.cats.length%PAL.length]}];s.modal=null;save();});
    }
    toast("✅ Categoría añadida");
  });

  // edit items
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    const raw=b.dataset.edit;
    if(raw.endsWith("_exp")){mut(s=>s.modal="edit-exp-"+raw.replace("_exp",""));}
    else if(raw.endsWith("_inc")){mut(s=>s.modal="edit-inc-"+raw.replace("_inc",""));}
  }));

  // delete items
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const raw=b.dataset.del;
    mut(s=>{
      if(raw.endsWith("_exp")){
        const id=raw.replace("_exp","");
        const exp=(s.exps[key]||[]).find(e=>String(e.id)===id);
        if(exp?.accId)s.accs=s.accs.map(a=>a.id===exp.accId?{...a,balance:Math.round((a.balance+exp.amount)*100)/100}:a);
        s.exps={...s.exps,[key]:(s.exps[key]||[]).filter(e=>String(e.id)!==id)};
      } else if(raw.endsWith("_inc")){
        const id=raw.replace("_inc","");
        const inc=(s.incs[key]||[]).find(i=>String(i.id)===id);
        if(inc?.accId)s.accs=s.accs.map(a=>a.id===inc.accId?{...a,balance:Math.round((a.balance-inc.amount)*100)/100}:a);
        s.incs={...s.incs,[key]:(s.incs[key]||[]).filter(i=>String(i.id)!==id)};
      }
      save();
    });
    toast("🗑️ Eliminado");
  }));

  document.querySelectorAll("[data-edit-acc]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.modal="edit-acc-"+b.dataset.editAcc)));
  document.querySelectorAll("[data-del-acc]").forEach(b=>b.addEventListener("click",()=>{mut(s=>{s.accs=s.accs.filter(a=>a.id!==+b.dataset.delAcc);save();});toast("🗑️ Cuenta eliminada");}));
  document.querySelectorAll("[data-budget]").forEach(inp=>inp.addEventListener("change",()=>{mut(s=>{s.cats=s.cats.map(c=>c.id===inp.dataset.budget?{...c,budget:parseFloat(inp.value)||0}:c);save();});}));
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>mut(s=>{s.cats=s.cats.map(c=>c.id===b.dataset.toggle?{...c,fixed:!c.fixed}:c);save();})));

  // backup
  document.getElementById("do-export")?.addEventListener("click",exportData);
  document.getElementById("import-file")?.addEventListener("change",e=>importData(e.target.files[0]));

  // AI
  document.getElementById("run-ai")?.addEventListener("click",()=>{
    if(ST.aiLoad)return;
    mut(s=>{s.aiLoad=true;s.aiRes=null;});
    setTimeout(()=>{
      const d2=D();
      const{mIncome,mSpent,mSaved,mRate,catT}=d2;
      let score=100,alertas=[],recomendaciones=[],categorias_reducir=[];
      if(mRate<0){score-=30;alertas.push("Estás gastando más de lo que ganas este mes.");}
      else if(mRate<10){score-=20;alertas.push("Tu tasa de ahorro es muy baja ("+mRate+"%). Lo ideal es al menos 20%.");}
      else if(mRate<20){score-=10;alertas.push("Tu tasa de ahorro ("+mRate+"%) está por debajo del 20% recomendado.");}
      if(goal>0&&mSaved<goal){const diff=goal-mSaved;score-=10;alertas.push("No alcanzaste tu meta. Faltan "+fmt(diff)+".");recomendaciones.push({titulo:"Alcanza tu meta de ahorro",detalle:"Para llegar a "+fmt(goal)+" necesitas reducir gastos en "+fmt(diff)+". Revisa categorías variables.",ahorro:Math.round(diff)});}
      const excedidas=catT.filter(c=>c.spent>c.budget&&c.budget>0);
      excedidas.forEach(c=>{const extra=c.spent-c.budget;score-=8;alertas.push(c.name+" excedió presupuesto en "+fmt(extra)+".");categorias_reducir.push({nombre:c.name,potencial:Math.round(extra),sugerencia:"Reducir a "+fmt(c.budget)+" te ahorraría "+fmt(extra)+" al mes."});});
      catT.filter(c=>!c.fixed&&c.spent>0&&c.budget>0&&pct(c.spent,c.budget)>75&&!excedidas.find(e=>e.id===c.id)).slice(0,3).forEach(c=>{const p=Math.round(c.spent*.15);categorias_reducir.push({nombre:c.name,potencial:p,sugerencia:"Usas el "+pct(c.spent,c.budget)+"% del presupuesto. Reducir 15% = "+fmt(p)+"/mes."});});
      if(mIncome===0){score-=15;alertas.push("No tienes ingresos registrados este mes.");}
      const totalFijo=catT.filter(c=>c.fixed).reduce((a,c)=>a+c.spent,0);
      if(mIncome>0&&totalFijo/mIncome>0.6){score-=10;alertas.push("Gastos fijos = "+Math.round(totalFijo/mIncome*100)+"% de ingresos. Ideal < 50%.");recomendaciones.push({titulo:"Reduce compromisos fijos",detalle:"Revisa suscripciones. El objetivo es que no superen el 50% de ingresos.",ahorro:Math.round(totalFijo*.1)});}
      if(mRate>=20)recomendaciones.push({titulo:"Construye tu fondo de emergencia",detalle:"Con el "+mRate+"% de ahorro vas bien. Apunta a 3-6 meses de gastos ("+fmt(mSpent*3)+"–"+fmt(mSpent*6)+") como colchón.",ahorro:0});
      if(mSaved>goal*1.5&&goal>0)recomendaciones.push({titulo:"Invierte tu excedente",detalle:"Tienes "+fmt(mSaved-goal)+" sobre tu meta. Considera fondos indexados o cuentas de alto rendimiento.",ahorro:0});
      score=Math.max(10,Math.min(100,score));
      const resumen=mIncome===0?"Sin ingresos registrados este mes.":mRate>=20?"Excelente mes — "+mRate+"% de ahorro y excedente de "+fmt(mSaved)+".":mRate>=10?"Mes razonable con "+mRate+"% de ahorro. Puedes mejorar.":mRate>=0?"Mes ajustado — solo "+mRate+"% de ahorro.":"Mes en negativo — gastaste "+fmt(Math.abs(mSaved))+" más de lo que ganaste.";
      const conclusion=score>=80?"Salud financiera excelente. Mantén la disciplina e invierte el excedente.":score>=60?"Base sólida. Enfócate en categorías excedidas y aumenta el ahorro.":score>=40?"Necesitas atención. Reduce gastos no esenciales.":"Situación crítica. Revisa urgentemente todos tus gastos.";
      mut(s=>{s.aiRes={resumen,alertas,recomendaciones,categorias_reducir,puntuacion:score,conclusion};s.aiLoad=false;});
    },900);
  });
}

function render(){const d=D();document.getElementById("app").innerHTML=buildApp(d);bindEvents(d);}
render();
</script>
