<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinTrack Pro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0c10;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:100vw;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c10;--surf:#111318;--card:#161a22;--bord:#1e2330;--acc:#00e5a0;--warn:#ff6b35;--dang:#ff3b5c;--gold:#ffc94a;--blue:#4d9fff;--text:#e2e8f0;--sub:#718096}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fi{animation:fadeIn .3s ease}
input,select,button,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bord);border-radius:99px}

/* Layout */
#app{min-height:100vh;padding-bottom:65px}
.header{background:var(--surf);border-bottom:1px solid var(--bord);padding:0 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:52px}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;color:var(--acc)}
.month-nav{display:flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--bord);border-radius:9px;padding:5px 10px}
.month-nav button{background:none;border:none;color:var(--sub);font-size:18px;padding:0 3px;line-height:1}
.month-nav span{font-weight:700;font-size:12px;min-width:90px;text-align:center;color:var(--text)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--bord);display:flex;z-index:200}
.nav button{flex:1;background:none;border:none;border-top:2px solid transparent;padding:8px 0 5px;color:var(--sub);font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.nav button.act{color:var(--acc);border-top-color:var(--acc)}
.nav button span.ico{font-size:18px}
.content{padding:12px}

/* Cards */
.card{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px;margin-bottom:10px}
.card.glow-acc{box-shadow:0 0 18px #00e5a018;border-color:#00e5a040}
.card.glow-gold{box-shadow:0 0 18px #ffc94a18;border-color:#ffc94a40}
.card.glow-blue{box-shadow:0 0 18px #4d9fff18;border-color:#4d9fff40}
.card.glow-dang{box-shadow:0 0 18px #ff3b5c18;border-color:#ff3b5c40}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:13px}
.stat .lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.stat .val{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat .sub{font-size:10px;color:var(--sub);margin-top:2px}

/* Progress bar */
.pbar{height:7px;border-radius:99px;background:var(--bord);overflow:hidden;margin-top:4px}
.pbar .fill{height:100%;border-radius:99px;transition:width .5s}

/* Badge */
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}

/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Transaction row */
.trow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bord)}
.trow:last-child{border-bottom:none}
.trow .icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.trow .info{flex:1;min-width:0}
.trow .info .name{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .info .meta{font-size:10px;color:var(--sub);margin-top:1px}
.trow .amt{font-weight:800;font-size:13px;white-space:nowrap}
.trow .del{background:none;border:none;color:var(--sub);font-size:16px;padding:2px 6px;flex-shrink:0}

/* Sub-tabs */
.subtabs{display:flex;background:var(--surf);border-radius:12px;padding:3px;border:1px solid var(--bord);margin-bottom:12px;gap:2px}
.subtabs button{flex:1;background:none;border:1px solid transparent;border-radius:9px;padding:8px 8px;color:var(--sub);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.subtabs button.act{background:var(--card);border-color:var(--bord);color:var(--text)}
.cnt-badge{border-radius:99px;padding:1px 7px;font-size:10px;font-weight:800}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:600;padding:14px}
.modal{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:420px;animation:fadeIn .2s ease;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:800;margin-bottom:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-close{background:none;border:none;color:var(--sub);font-size:24px;line-height:1}
.flabel{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:5px}
.finput{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit}
.fselect{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit}
.fgroup{margin-bottom:13px}
.btn{width:100%;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:14px;font-family:inherit}
.btn-acc{background:var(--acc);color:#000}
.btn-blue{background:var(--blue);color:#000}
.btn-gold{background:var(--gold);color:#000}
.btn-out{background:var(--surf);border:1px solid var(--bord)!important;color:var(--sub)}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn-row .btn{flex:1}

/* Alert */
.alert{border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}

/* AI */
.ai-score{text-align:center;padding:16px;min-width:90px}
.ai-score .num{font-size:38px;font-weight:900}
.ai-rec{display:flex;gap:8px;padding:10px;border-radius:9px;margin-bottom:7px}
.ai-rec .num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}

/* Spinner */
.spin{display:inline-block;width:18px;height:18px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

/* Big number input */
.big-inp{display:flex;align-items:center;gap:8px;border-radius:10px;padding:11px 14px}
.big-inp input{background:none;border:none;font-size:22px;font-weight:800;color:var(--text);width:100%;font-family:inherit}
.big-inp .sym{font-size:20px;font-weight:800}

/* Section header */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-head .title{font-weight:800;font-size:15px}
.sec-head .sub{color:var(--sub);font-size:12px;margin-top:1px}
.btn-sm{border:none;border-radius:10px;padding:8px 16px;font-weight:800;font-size:13px;font-family:inherit}

/* Empty state */
.empty{text-align:center;padding:32px 16px}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty .t{font-weight:700;font-size:14px;margin-bottom:5px}
.empty .s{color:var(--sub);font-size:12px}

/* Pill account tags */
.acc-pill{border-radius:8px;padding:3px 9px;font-size:11px;display:inline-flex;align-items:center;gap:4px}

/* Charts using CSS bars */
.cbar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cbar-label{font-size:10px;color:var(--sub);width:70px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar-track{flex:1;height:14px;background:var(--bord);border-radius:99px;overflow:hidden;position:relative}
.cbar-fill{height:100%;border-radius:99px;transition:width .6s}
.cbar-track .cbar-bg{position:absolute;top:0;left:0;height:100%;border-radius:99px;opacity:.25}
.cbar-val{font-size:10px;font-weight:700;width:52px;text-align:right;flex-shrink:0}

/* Pie simulation with inline SVG approach replaced by CSS donut */
.donut-wrap{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Trend mini bars */
.trend-row{display:flex;align-items:flex-end;gap:4px;height:80px;padding-top:4px}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.trend-bars{display:flex;gap:2px;align-items:flex-end;height:65px}
.trend-bar{width:10px;border-radius:3px 3px 0 0;min-height:2px;transition:height .5s}
.trend-label{font-size:9px;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Storage helper ──
const S = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ── Data ──
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const INC_CATS = ["Salario","Freelance","Inversiones","Alquiler","Pensión","Bono","Otros"];
const ACC_TYPES = ["Corriente","Ahorro","Inversión","Efectivo","Crypto","Otro"];
const PAL = ["#00e5a0","#4d9fff","#ffc94a","#ff6b35","#c77dff","#ff3b5c","#00d4ff","#a8ff78","#f7971e","#12c2e9"];
const ACOLS = ["#4d9fff","#00e5a0","#ffc94a","#c77dff","#ff6b35","#ff3b5c","#12c2e9","#a8ff78"];
const DEF_CATS = [
  {id:"vivienda",name:"Vivienda",icon:"🏠",fixed:true,budget:1200,color:PAL[0]},
  {id:"alimentacion",name:"Alimentación",icon:"🛒",fixed:false,budget:400,color:PAL[1]},
  {id:"transporte",name:"Transporte",icon:"🚗",fixed:false,budget:200,color:PAL[2]},
  {id:"salud",name:"Salud",icon:"💊",fixed:true,budget:150,color:PAL[3]},
  {id:"educacion",name:"Educación",icon:"📚",fixed:true,budget:100,color:PAL[4]},
  {id:"ocio",name:"Ocio",icon:"🎮",fixed:false,budget:150,color:PAL[5]},
  {id:"ropa",name:"Ropa",icon:"👗",fixed:false,budget:100,color:PAL[6]},
  {id:"suscripciones",name:"Suscripciones",icon:"📱",fixed:true,budget:80,color:PAL[7]},
  {id:"restaurantes",name:"Restaurantes",icon:"🍽",fixed:false,budget:200,color:PAL[8]},
  {id:"otros",name:"Otros",icon:"💼",fixed:false,budget:100,color:PAL[9]},
];

const fmt = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const pct = (a,b) => b===0?0:Math.min(Math.round(a/b*100),999);
const mk = (y,m) => `${y}-${String(m+1).padStart(2,"0")}`;
const today = () => new Date().toISOString().slice(0,10);
const clamp = (v,mn,mx) => Math.min(Math.max(v,mn),mx);

// ── State ──
let state = {
  tab: "dashboard",
  sub2: "gastos",
  yr: new Date().getFullYear(),
  mo: new Date().getMonth(),
  cats: S.get("ft_cats", DEF_CATS),
  exps: S.get("ft_exps", {}),
  incs: S.get("ft_incs", {}),
  accs: S.get("ft_accs", []),
  goal: S.get("ft_goal", 500),
  modal: null, // {type, data}
  notif: null,
  aiRes: null,
  aiLoad: false,
};

// ── Derived ──
function derived(){
  const {yr,mo,cats,exps,incs,accs,goal} = state;
  const key = mk(yr,mo);
  const mExps = exps[key]||[];
  const mIncs = incs[key]||[];
  const mIncome = mIncs.reduce((a,i)=>a+i.amount,0);
  const mSpent = mExps.reduce((a,e)=>a+e.amount,0);
  const mBudget = cats.reduce((a,c)=>a+c.budget,0);
  const mSaved = mIncome - mSpent;
  const mRate = mIncome>0 ? Math.round(mSaved/mIncome*100) : 0;
  const catT = cats.map(c=>({...c, spent: mExps.filter(e=>e.catId===c.id).reduce((a,e)=>a+e.amount,0)}));
  const totalBal = accs.reduce((a,c)=>a+c.balance,0);
  const alerts = catT.filter(c=>pct(c.spent,c.budget)>=90&&c.spent>0);
  const key6 = Array.from({length:6},(_,i)=>{ const d=new Date(yr,mo-5+i); return {label:MONTHS[d.getMonth()].slice(0,3), k:mk(d.getFullYear(),d.getMonth())}; });
  const incPie = mIncs.reduce((acc,i)=>{const x=acc.find(a=>a.name===i.category);if(x)x.v+=i.amount;else acc.push({name:i.category||"Otros",v:i.amount,color:PAL[acc.length%PAL.length]});return acc;},[]);
  return {key,mExps,mIncs,mIncome,mSpent,mBudget,mSaved,mRate,catT,totalBal,alerts,key6,incPie};
}

// ── Mutations ──
function mut(fn){ fn(state); render(); }
const save = () => { S.set("ft_cats",state.cats); S.set("ft_exps",state.exps); S.set("ft_incs",state.incs); S.set("ft_accs",state.accs); S.set("ft_goal",state.goal); };

// ── Export / Import ──
function exportData(){
  const data = {
    version: 1,
    exported: new Date().toISOString(),
    cats: state.cats,
    exps: state.exps,
    incs: state.incs,
    accs: state.accs,
    goal: state.goal,
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `FinTrack_backup_${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mut(s=>s.notif="✅ Backup descargado: FinTrack_backup_"+date+".json");
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.version || !data.cats || !data.exps) throw new Error("Formato inválido");
      mut(s=>{
        s.cats = data.cats || DEF_CATS;
        s.exps = data.exps || {};
        s.incs = data.incs || {};
        s.accs = data.accs || [];
        s.goal = data.goal || 500;
        s.modal = null;
        s.notif = "✅ Datos restaurados correctamente";
        save();
      });
    } catch(err) {
      mut(s=>s.notif="❌ Error: archivo inválido. Usa un backup de FinTrack.");
    }
  };
  reader.readAsText(file);
}

// ── Render engine ──
function render(){
  const d = derived();
  document.getElementById("app").innerHTML = buildApp(d);
  bindEvents(d);
}

// ── Color helpers ──
const pbarColor = (p) => p>=100?"#ff3b5c":p>=80?"#ff6b35":"#00e5a0";
const hex2rgba = (hex,a=1) => { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };

// ── HTML builders ──
function card(content, cls="", style="") { return `<div class="card ${cls}" style="${style}">${content}</div>`; }
function badge(text, color) { return `<span class="badge" style="background:${hex2rgba(color,.15)};color:${color};border:1px solid ${hex2rgba(color,.3)}">${text}</span>`; }
function pbar(val,max,color){ const p=pct(val,max),c=pbarColor(p); return `<div class="pbar"><div class="fill" style="width:${Math.min(p,100)}%;background:${c}"></div></div>`; }
function btn(text,id,cls,style=""){ return `<button class="btn ${cls}" id="${id}" style="${style}">${text}</button>`; }
function statCard(label,val,sub,color,icon){ return `<div class="stat" style="border-color:${hex2rgba(color,.3)};box-shadow:0 0 16px ${hex2rgba(color,.08)}"><div class="lbl">${label}</div><div class="val" style="color:${color}">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}<span style="position:absolute;right:12px;top:12px;font-size:20px;opacity:.4">${icon}</span></div>`; }
function trow(id,iconEmo,iconBg,name,meta,amt,amtColor){ return `<div class="trow"><div class="icon" style="background:${iconBg}">${iconEmo}</div><div class="info"><div class="name">${name}</div><div class="meta">${meta}</div></div><div class="amt" style="color:${amtColor||"#e2e8f0"}">${amt}</div><button class="del" data-del="${id}">✕</button></div>`; }

// ── Chart builders (CSS-based, no lib needed) ──
function cssBarChart(items, maxVal){ // items: [{label,val,budget,color}]
  const max = maxVal || Math.max(...items.map(i=>Math.max(i.val,i.budget||0)),1);
  return items.map(i=>{
    const wp = clamp(i.val/max*100,0,100);
    const bp = i.budget ? clamp(i.budget/max*100,0,100) : 0;
    const c = pbarColor(pct(i.val,i.budget||i.val));
    return `<div class="cbar-row">
      <div class="cbar-label" title="${i.label}">${i.label}</div>
      <div class="cbar-track">
        ${i.budget?`<div class="cbar-bg" style="width:${bp}%;background:${i.color}"></div>`:""}
        <div class="cbar-fill" style="width:${wp}%;background:${c}"></div>
      </div>
      <div class="cbar-val" style="color:${c}">${fmt(i.val)}</div>
    </div>`;
  }).join("");
}

function donutChart(items){ // returns SVG donut
  const total = items.reduce((a,i)=>a+i.v,0);
  if(!total) return `<div style="text-align:center;color:var(--sub);padding:20px;font-size:12px">Sin datos</div>`;
  let cumulative = 0;
  const r = 40, cx = 50, cy = 50, strokeW = 18;
  const circumference = 2*Math.PI*r;
  const segs = items.map(item => {
    const frac = item.v/total;
    const dash = frac*circumference;
    const gap = circumference - dash;
    const offset = circumference - cumulative*circumference;
    cumulative += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${item.color}" stroke-width="${strokeW}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join("");
  const legend = items.map(i=>`<div class="legend-item"><div class="legend-dot" style="background:${i.color}"></div><span style="flex:1;color:var(--sub)">${i.name}</span><span style="font-weight:700;color:${i.color}">${fmt(i.v)}</span></div>`).join("");
  return `<div class="donut-wrap">
    <svg width="100" height="100" viewBox="0 0 100 100">${segs}<text x="50" y="54" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="800">${fmt(total)}</text></svg>
    <div style="flex:1">${legend}</div>
  </div>`;
}

function trendChart(key6, exps, incs){
  const data = key6.map(({label,k})=>({
    label,
    gasto: (exps[k]||[]).reduce((a,e)=>a+e.amount,0),
    ingreso: (incs[k]||[]).reduce((a,e)=>a+e.amount,0)
  }));
  const maxVal = Math.max(...data.map(d=>Math.max(d.gasto,d.ingreso)),1);
  const cols = data.map(d=>{
    const hG = clamp(d.gasto/maxVal*60,2,60);
    const hI = clamp(d.ingreso/maxVal*60,2,60);
    return `<div class="trend-col">
      <div class="trend-bars">
        <div class="trend-bar" style="height:${hI}px;background:#00e5a0" title="Ingreso: ${fmt(d.ingreso)}"></div>
        <div class="trend-bar" style="height:${hG}px;background:#ff6b35" title="Gasto: ${fmt(d.gasto)}"></div>
      </div>
      <div class="trend-label">${d.label}</div>
    </div>`;
  }).join("");
  return `<div>
    <div style="display:flex;gap:10px;margin-bottom:8px">
      <span style="font-size:10px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:#00e5a0;border-radius:2px;display:inline-block"></span>Ingreso</span>
      <span style="font-size:10px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:#ff6b35;border-radius:2px;display:inline-block"></span>Gasto</span>
    </div>
    <div class="trend-row">${cols}</div>
  </div>`;
}

// ── Modal HTML builders ──
function modalExpense(){
  const cats = state.cats;
  return `<div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head"><span style="font-weight:800;font-size:16px">💸 Añadir Gasto</span><button class="modal-close" id="close-modal">×</button></div>

      <div class="fgroup"><label class="flabel">Tipo</label><select class="fselect" id="m-type" style="border-color:${hex2rgba(col,.3)}">${ACC_TYPES.map(t=>`<option value="${t}"${acc?.type===t?" selected":""}>${t}</option>`).join("")}</select></div>

function modalGoal(){

    <div class="modal" style="border-color:#ffc94a40">
      <div class="modal-head"><span style="font-weight:800;font-size:16px">🎯 Meta de Ahorro</span><button class="modal-close" id="close-modal">×</button></div>

function modalBackup(){
  const expCount = Object.values(state.exps).reduce((a,v)=>a+v.length,0);
  const incCount = Object.values(state.incs).reduce((a,v)=>a+v.length,0);
  const months = new Set([...Object.keys(state.exps),...Object.keys(state.incs)]).size;
  return `<div class="overlay" id="overlay">
    <div class="modal" style="border-color:#4d9fff40">
      <div class="modal-head"><span style="font-weight:800;font-size:16px">💾 Backup de Datos</span><button class="modal-close" id="close-modal">×</button></div>

      <div style="background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:14px;margin-bottom:16px">
        <div style="font-size:11px;color:var(--sub);font-weight:600;margin-bottom:10px;letter-spacing:1px">TUS DATOS ACTUALES</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${[
            {icon:"💸",label:"Gastos",val:expCount+" registros"},
            {icon:"💵",label:"Ingresos",val:incCount+" registros"},
            {icon:"🏦",label:"Cuentas",val:state.accs.length+" cuentas"},
            {icon:"📅",label:"Meses",val:months+" meses"},
          ].map(i=>`<div style="background:var(--card);border-radius:9px;padding:10px;text-align:center">
            <div style="font-size:18px">${i.icon}</div>
            <div style="font-size:10px;color:var(--sub);margin-top:3px">${i.label}</div>
            <div style="font-size:12px;font-weight:700;margin-top:1px">${i.val}</div>
          </div>`).join("")}
        </div>
      </div>

      <button class="btn" id="do-export" style="background:linear-gradient(135deg,#00e5a0,#00b4d8);color:#000;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px">
        📥 Descargar Backup (.json)
      </button>

      <div style="position:relative;margin-bottom:16px">
        <div style="height:1px;background:var(--bord)"></div>
        <span style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--card);padding:0 10px;font-size:11px;color:var(--sub)">o restaurar</span>
      </div>

      <label style="display:block;background:var(--surf);border:2px dashed var(--bord);border-radius:12px;padding:18px;text-align:center;cursor:pointer" id="import-zone">
        <div style="font-size:28px;margin-bottom:6px">📂</div>
        <div style="font-weight:700;font-size:13px;margin-bottom:3px">Importar Backup</div>
        <div style="font-size:11px;color:var(--sub)">Toca para seleccionar tu archivo .json</div>
        <input type="file" id="import-file" accept=".json" style="display:none"/>
      </label>

      <div style="margin-top:12px;background:#ff6b3515;border:1px solid #ff6b3530;border-radius:9px;padding:10px 12px;font-size:11px;color:#ff6b35">
        ⚠️ Importar reemplazará todos los datos actuales. Haz un backup antes.
      </div>

      <button class="btn btn-out" id="close-modal2" style="margin-top:12px">Cerrar</button>
    </div>
  </div>`;
}

function buildApp(d){
  const {key,mExps,mIncs,mIncome,mSpent,mBudget,mSaved,mRate,catT,totalBal,alerts,key6,incPie} = d;
  const {tab,sub2,yr,mo,cats,exps,incs,accs,goal,modal,notif,aiRes,aiLoad} = state;

  let modalHtml = "";
  if(modal==="exp") modalHtml = modalExpense();
  else if(modal==="inc") modalHtml = modalIncome();
  else if(modal==="acc") modalHtml = modalAccount(null);
  else if(modal && modal.startsWith("edit-acc-")) { const id=+modal.replace("edit-acc-",""); const acc=accs.find(a=>a.id===id); if(acc) modalHtml=modalAccount(acc); }
  else if(modal==="goal") modalHtml = modalGoal();
  else if(modal==="backup") modalHtml = modalBackup();

  const notifHtml = notif ? `<div style="position:fixed;top:12px;left:12px;right:12px;z-index:900;background:#ff3b5c20;border:1px solid #ff3b5c50;border-radius:12px;padding:10px 14px;color:#ff3b5c;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px">
    <span style="flex:1">${notif}</span><button id="close-notif" style="background:none;border:none;color:var(--sub);font-size:18px">×</button></div>` : "";

  // TABS
  const TABS = [{id:"dashboard",icon:"📊",label:"Inicio"},{id:"movimientos",icon:"💸",label:"Movimientos"},{id:"cuentas",icon:"🏦",label:"Cuentas"},{id:"presupuesto",icon:"🎯",label:"Budget"},{id:"analisis",icon:"🤖",label:"IA"}];
  const navHtml = `<nav class="nav">${TABS.map(t=>`<button class="${tab===t.id?"act":""}" data-tab="${t.id}"><span class="ico">${t.icon}</span>${t.label}</button>`).join("")}</nav>`;

  const headerHtml = `<div class="header">
    <div class="logo">💰 FinTrack Pro</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="open-backup" title="Backup" style="background:none;border:1px solid var(--bord);border-radius:9px;padding:6px 10px;color:var(--sub);font-size:14px;line-height:1">💾</button>
      <div class="month-nav">
        <button id="prev-mo">‹</button>
        <span>${MONTHS[mo].slice(0,3)} ${yr}</span>
        <button id="next-mo">›</button>
      </div>
    </div>
  </div>`;

  let pageHtml = "";

  if(tab==="dashboard"){
    const goalPct = clamp(pct(Math.max(mSaved,0),goal),0,100);
    const goalColor = mSaved>=goal?"#00e5a0":"#ffc94a";
    pageHtml = `
      <div class="stat-grid" style="position:relative">
        ${statCard("Ingresos",fmt(mIncome),"","#00e5a0","💵")}
        ${statCard("Gastos",fmt(mSpent),"de "+fmt(mBudget),mSpent>mBudget?"#ff3b5c":"#ff6b35","💸")}
        ${statCard("Disponible",fmt(mIncome-mSpent),"",mSaved>=0?"#00e5a0":"#ff3b5c","🏦")}
        ${statCard("Ahorro",mRate+"%","Meta: "+fmt(goal),mRate>=20?"#00e5a0":mRate>=10?"#ffc94a":"#ff3b5c","🎯")}
      </div>

      ${accs.length>0?card(`
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div><div style="font-size:9px;color:var(--sub);font-weight:600;letter-spacing:1px">BALANCE TOTAL CUENTAS</div>
          <div style="font-size:20px;font-weight:900;color:${totalBal>=0?"#4d9fff":"#ff3b5c"}">${fmt(totalBal)}</div></div>
          <span style="font-size:22px;opacity:.5">🏦</span>

        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${accs.map(a=>`<div class="acc-pill" style="background:${hex2rgba(a.color,.12)};border:1px solid ${hex2rgba(a.color,.3)}"><span style="color:var(--sub)">${a.name.slice(0,10)}: </span><span style="font-weight:700;color:${a.balance>=0?a.color:"#ff3b5c"}">${fmt(a.balance)}</span></div>`).join("")}
        </div>
      `,"glow-blue"):""}

      <div class="card ${mSaved>=goal?"glow-acc":"glow-gold"}">

      ${alerts.length>0?`<div style="margin-bottom:10px">${alerts.map(a=>{const p2=pct(a.spent,a.budget);const col=p2>=100?"#ff3b5c":"#ff6b35";return `<div class="alert" style="background:${hex2rgba(col,.1)};border:1px solid ${hex2rgba(col,.3)}"><span>${a.icon}</span><span style="flex:1">${a.name}: ${fmt(a.spent)} / ${fmt(a.budget)}</span>${badge(p2>=100?"EXCEDIDO":"ALERTA",col)}</div>`}).join("")}</div>`:""}

        ${card(`<div style="font-weight:700;font-size:12px;margin-bottom:10px">Gasto vs Budget</div>${cssBarChart(catT.filter(c=>c.budget>0||c.spent>0).map(c=>({label:c.name.slice(0,7),val:c.spent,budget:c.budget,color:c.color})))}`)}

    `;
  }

  else if(tab==="movimientos"){
    const subTabs = `<div class="subtabs">

            <span style="font-weight:700;color:var(--text);font-size:12px">${fmt(c.spent)}</span><span>/ ${fmt(c.budget)}</span>

      pageHtml = `${subTabs}
        <div class="sec-head"><div><div class="title">Gastos de ${MONTHS[mo]}</div><div class="sub">Total: ${fmt(mSpent)}</div></div><button class="btn-sm btn-acc" id="open-exp">+ Añadir</button></div>
        <div class="g2" style="margin-bottom:12px">${catCards}</div>
        ${card(`<div style="font-weight:700;font-size:13px;margin-bottom:10px">Transacciones</div>${rows||`<div class="empty"><div class="ico">📋</div><div class="t">Sin gastos</div><div class="s">Pulsa + Añadir</div></div>`}`)}`;
    } else {
      const rows = [...mIncs].sort((a,b)=>b.date.localeCompare(a.date)).map(i=>trow(i.id+"_inc","💵",hex2rgba("#00e5a0",.12),i.desc,i.category+" · "+i.date,fmt(i.amount),"#00e5a0")).join("");

        <div class="sec-head"><div><div class="title">Ingresos de ${MONTHS[mo]}</div><div class="sub">Total: <span style="color:#00e5a0;font-weight:700">${fmt(mIncome)}</span></div></div><button class="btn-sm btn-acc" id="open-inc">+ Añadir</button></div>

        ${card(`<div style="font-weight:700;font-size:13px;margin-bottom:10px">Registro de Ingresos</div>${rows||`<div class="empty"><div class="ico">💵</div><div class="t">Sin ingresos</div><div class="s">Pulsa + Añadir</div></div>`}`)}`;

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">

        <div style="display:flex;align-items:center;gap:5px;margin-bottom:7px">
          <span style="color:var(--sub);font-size:10px">€</span>
          <input type="number" data-budget="${c.id}" value="${c.budget}" style="width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:8px;padding:5px 8px;color:var(--text);font-weight:700;font-size:12px;font-family:inherit"/>
        </div>
        ${pbar(c.spent,c.budget,c.color)}
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--sub)">
          <span>${pct(c.spent,c.budget)}% usado</span>
          <span style="color:${c.spent>c.budget?"#ff3b5c":"#00e5a0"};font-weight:600">${c.spent>c.budget?"-"+fmt(c.spent-c.budget):"+"+fmt(c.budget-c.spent)}</span>
        </div>
      </div>`).join("");
    pageHtml = `<div class="sec-head"><div><div class="title">Presupuesto</div><div class="sub">Total: ${fmt(mBudget)}</div></div></div><div class="g2">${cards}</div>`;
  }

  else if(tab==="analisis"){
    const aiHtml = aiLoad
      ? `<div class="empty"><div style="font-size:40px;animation:pulse 1s infinite">⚙️</div><div class="t">Analizando...</div></div>`
      : aiRes && !aiRes.error
        ? `<div class="g2" style="margin-bottom:10px">
            <div class="card ${aiRes.puntuacion>=70?"glow-acc":aiRes.puntuacion>=50?"glow-gold":"glow-dang"}" style="text-align:center;padding:14px">
              <div style="font-size:9px;color:var(--sub);font-weight:600;margin-bottom:4px">PUNTUACIÓN</div>
              <div class="ai-score"><div class="num" style="color:${aiRes.puntuacion>=70?"#00e5a0":aiRes.puntuacion>=50?"#ffc94a":"#ff3b5c"}">${aiRes.puntuacion}</div></div>
              <div style="font-size:9px;color:var(--sub)">de 100</div>
            </div>
            <div class="card" style="padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:6px">📝 Resumen</div><p style="color:var(--sub);font-size:11px;line-height:1.6">${aiRes.resumen}</p>
              ${aiRes.alertas?.length?aiRes.alertas.map(a=>`<div style="background:#ff6b3520;border:1px solid #ff6b3530;border-radius:7px;padding:5px 9px;font-size:11px;color:#ff6b35;margin-top:5px">⚠️ ${a}</div>`).join(""):""}
            </div>
          </div>
          ${aiRes.categorias_reducir?.length?`<div class="card" style="padding:13px;margin-bottom:10px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">✂️ Dónde Reducir</div>${aiRes.categorias_reducir.map(c=>`<div style="background:#ff3b5c15;border:1px solid #ff3b5c25;border-radius:9px;padding:10px;margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-weight:700;font-size:12px">${c.nombre}</span>${badge("Ahorro: "+fmt(c.potencial),"#00e5a0")}</div><p style="color:var(--sub);font-size:11px;line-height:1.5">${c.sugerencia}</p></div>`).join("")}</div>`:""}
          ${aiRes.recomendaciones?.length?`<div class="card" style="padding:13px;margin-bottom:10px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">💡 Recomendaciones</div>${aiRes.recomendaciones.map((r,i)=>`<div class="ai-rec" style="background:#00e5a015;border:1px solid #00e5a025;margin-bottom:7px"><div class="num" style="background:#00e5a030;color:#00e5a0">${i+1}</div><div style="flex:1"><div style="font-weight:700;font-size:12px;margin-bottom:2px">${r.titulo}</div><p style="color:var(--sub);font-size:11px;line-height:1.5">${r.detalle}</p></div></div>`).join("")}</div>`:""}
          ${aiRes.conclusion?`<div class="card glow-acc" style="border-left:3px solid #00e5a0;padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:5px">🎯 Conclusión</div><p style="color:var(--sub);font-size:12px;line-height:1.6">${aiRes.conclusion}</p></div>`:""}
         `
        : aiRes?.error
          ? `<div class="card" style="background:#ff3b5c15;text-align:center;padding:24px"><div style="color:#ff3b5c;font-weight:700">${aiRes.error}</div></div>`
          : `<div class="empty"><div class="ico">🤖</div><div class="t">Análisis Inteligente</div><div class="s">Pulsa el botón para analizar ${MONTHS[mo]}</div></div>`;

    const mFixed = catT.filter(c=>c.fixed).reduce((a,c)=>a+c.spent,0);
    const mVar = catT.filter(c=>!c.fixed).reduce((a,c)=>a+c.spent,0);
    pageHtml = `
      <div class="sec-head" style="margin-bottom:12px"><div><div class="title">Análisis IA — ${MONTHS[mo]}</div><div class="sub">Recomendaciones personalizadas</div></div></div>
      <button id="run-ai" style="width:100%;background:${aiLoad?"var(--muted)":"linear-gradient(135deg,#00e5a0,#00b4d8)"};color:#000;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:14px;font-family:inherit;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;opacity:${aiLoad?.7:1}">
        ${aiLoad?`<span style="animation:pulse 1s infinite">⏳ Analizando...</span>`:"🤖 Analizar mis Finanzas"}
      </button>
      <div class="g2" style="margin-bottom:12px">
        <div class="card" style="padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">📊 Resumen</div>${[
          {l:"Ingresos",v:fmt(mIncome),c:"#00e5a0"},{l:"Gastos",v:fmt(mSpent),c:mSpent>mIncome?"#ff3b5c":"#ff6b35"},
          {l:"Fijos",v:fmt(mFixed),c:"#4d9fff"},{l:"Variables",v:fmt(mVar),c:"#ffc94a"},
          {l:"Ahorro",v:fmt(Math.max(mSaved,0)),c:"#00e5a0"},{l:"Tasa",v:mRate+"%",c:mRate>=20?"#00e5a0":mRate>=10?"#ffc94a":"#ff3b5c"}
        ].map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bord);font-size:11px"><span style="color:var(--sub)">${r.l}</span><span style="color:${r.c};font-weight:700">${r.v}</span></div>`).join("")}</div>
        <div class="card" style="padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">🏆 Top Gastos</div>${[...catT].sort((a,b)=>b.spent-a.spent).slice(0,6).map((c,i)=>`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--sub);font-size:10px;width:12px;font-weight:700">${i+1}</span><span style="font-size:12px">${c.icon}</span><span style="flex:1;font-size:11px">${c.name}</span><span style="font-weight:700;font-size:11px;color:${pct(c.spent,c.budget)>100?"#ff3b5c":"var(--text)"}">${fmt(c.spent)}</span></div>`).join("")}</div>
      </div>
      ${aiHtml}`;
  }

  return `${notifHtml}${modalHtml}
    <div id="app-inner">
      ${headerHtml}
      <div class="content fi">${pageHtml}</div>
      ${navHtml}
    </div>`;
}

// ── Event binding ──
function bindEvents(d){
  const {key} = d;

  // open backup modal
  document.getElementById("open-backup")?.addEventListener("click",()=>mut(s=>s.modal="backup"));

  // export
  document.getElementById("do-export")?.addEventListener("click",()=>exportData());

  // import file
  document.getElementById("import-file")?.addEventListener("change",e=>importData(e.target.files[0]));
  document.getElementById("import-zone")?.addEventListener("click",()=>document.getElementById("import-file")?.click());

  // close notif
  document.getElementById("close-notif")?.addEventListener("click",()=>{mut(s=>s.notif=null);});

  // nav tabs
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.tab=b.dataset.tab)));

  // month nav
  document.getElementById("prev-mo")?.addEventListener("click",()=>mut(s=>{const dd=new Date(s.yr,s.mo-1);s.yr=dd.getFullYear();s.mo=dd.getMonth();}));
  document.getElementById("next-mo")?.addEventListener("click",()=>mut(s=>{const dd=new Date(s.yr,s.mo+1);s.yr=dd.getFullYear();s.mo=dd.getMonth();}));

  // sub tabs
  document.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.sub2=b.dataset.sub)));

  // open modals
  document.getElementById("open-exp")?.addEventListener("click",()=>mut(s=>s.modal="exp"));
  document.getElementById("open-inc")?.addEventListener("click",()=>mut(s=>s.modal="inc"));
  document.getElementById("open-acc")?.addEventListener("click",()=>mut(s=>s.modal="acc"));
  document.getElementById("open-goal")?.addEventListener("click",()=>mut(s=>s.modal="goal"));

  // close modal
  ["close-modal","close-modal2"].forEach(id=>document.getElementById(id)?.addEventListener("click",()=>mut(s=>s.modal=null)));
  document.getElementById("overlay")?.addEventListener("click",e=>{if(e.target.id==="overlay")mut(s=>s.modal=null);});

  // save expense
  document.getElementById("save-exp")?.addEventListener("click",()=>{
    const desc=document.getElementById("m-desc")?.value.trim();
    const amount=+document.getElementById("m-amount")?.value;
    const catId=document.getElementById("m-cat")?.value;
    const date=document.getElementById("m-date")?.value||today();
    if(!desc||!amount||amount<=0)return;
    mut(s=>{s.exps={...s.exps,[key]:[...(s.exps[key]||[]),{id:Date.now(),desc,amount,catId,date}]};s.modal=null;save();});
  });

  // save income
  document.getElementById("save-inc")?.addEventListener("click",()=>{
    const desc=document.getElementById("m-desc")?.value.trim();
    const amount=+document.getElementById("m-amount")?.value;
    const category=document.getElementById("m-cat")?.value;
    const date=document.getElementById("m-date")?.value||today();
    if(!desc||!amount||amount<=0)return;
    mut(s=>{s.incs={...s.incs,[key]:[...(s.incs[key]||[]),{id:Date.now(),desc,amount,category,date}]};s.modal=null;save();});
  });

  // save account
  document.getElementById("save-acc")?.addEventListener("click",()=>{
    const name=document.getElementById("m-name")?.value.trim();
    const bank=document.getElementById("m-bank")?.value.trim();
    const type=document.getElementById("m-type")?.value;
    const balance=+document.getElementById("m-balance")?.value;
    if(!name||document.getElementById("m-balance")?.value==="")return;
    const editId = state.modal?.startsWith("edit-acc-") ? +state.modal.replace("edit-acc-","") : null;
    mut(s=>{
      if(editId){s.accs=s.accs.map(a=>a.id===editId?{...a,name,bank,type,balance}:a);}
      else{s.accs=[...s.accs,{id:Date.now(),name,bank,type,balance,color:ACOLS[s.accs.length%ACOLS.length]}];}
      s.modal=null;save();
    });
  });

  // save goal
  document.getElementById("save-goal")?.addEventListener("click",()=>{
    const v=+document.getElementById("m-goal")?.value;
    if(v>0)mut(s=>{s.goal=v;s.modal=null;save();});
    else mut(s=>s.modal=null);
  });

  // delete expense / income
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const raw=b.dataset.del;
    mut(s=>{
      if(raw.endsWith("_exp")){const id=+raw.replace("_exp","");s.exps={...s.exps,[key]:(s.exps[key]||[]).filter(e=>e.id!==id)};}
      else if(raw.endsWith("_inc")){const id=+raw.replace("_inc","");s.incs={...s.incs,[key]:(s.incs[key]||[]).filter(i=>i.id!==id)};}
      save();
    });
  }));

  // edit account
  document.querySelectorAll("[data-edit-acc]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.modal="edit-acc-"+b.dataset.editAcc)));

  // delete account
  document.querySelectorAll("[data-del-acc]").forEach(b=>b.addEventListener("click",()=>mut(s=>{s.accs=s.accs.filter(a=>a.id!==+b.dataset.delAcc);save();})));

  // budget inputs
  document.querySelectorAll("[data-budget]").forEach(inp=>inp.addEventListener("change",()=>mut(s=>{s.cats=s.cats.map(c=>c.id===inp.dataset.budget?{...c,budget:+inp.value}:c);save();})));

  // toggle fixed
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>mut(s=>{s.cats=s.cats.map(c=>c.id===b.dataset.toggle?{...c,fixed:!c.fixed}:c);save();})));

  // run AI
  document.getElementById("run-ai")?.addEventListener("click",async ()=>{
    if(state.aiLoad)return;
    mut(s=>{s.aiLoad=true;s.aiRes=null;});
    try{
      const {mExps,mIncs,mIncome,mSpent,mSaved,catT} = derived();
      const payload={month:MONTHS[state.mo],year:state.yr,income:mIncome,spent:mSpent,goal:state.goal,saved:mSaved,
        categories:catT.map(c=>({name:c.name,fixed:c.fixed,budget:c.budget,spent:c.spent,pct:pct(c.spent,c.budget)})),
        incomes:mIncs,expenses:mExps.slice(0,25),accounts:state.accs};
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,
          system:'Eres experto en finanzas personales. Devuelve SOLO JSON sin markdown: {"resumen":"string","alertas":["string"],"recomendaciones":[{"titulo":"string","detalle":"string","ahorro":number}],"categorias_reducir":[{"nombre":"string","potencial":number,"sugerencia":"string"}],"puntuacion":number,"conclusion":"string"}',
          messages:[{role:"user",content:"Analiza: "+JSON.stringify(payload)}]})});
      const j=await r.json();
      const txt=j.content.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      mut(s=>{s.aiRes=JSON.parse(txt);s.aiLoad=false;});
    }catch(e){
      mut(s=>{s.aiRes={error:"Sin conexión o error de red. El análisis IA requiere internet."};s.aiLoad=false;});
    }
  });

  // check overbudget alerts on load
  const {catT} = d;
  const over=catT.filter(c=>c.spent>c.budget&&c.spent>0);
  if(over.length>0&&!state.notif)mut(s=>s.notif="⚠️ Excedido: "+over.map(c=>c.name).join(", "));
}

// ── Boot ──
render();
</script>
</body>
</html>
