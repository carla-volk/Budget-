<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinTrack Pro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0c10;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:100vw;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0c10;--surf:#111318;--card:#161a22;--bord:#1e2330;--acc:#00e5a0;--warn:#ff6b35;--dang:#ff3b5c;--gold:#ffc94a;--blue:#4d9fff;--text:#e2e8f0;--sub:#718096}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeIn .3s ease}
input,select,button,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bord);border-radius:99px}
#app{min-height:100vh;padding-bottom:65px}
.header{background:var(--surf);border-bottom:1px solid var(--bord);padding:0 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:52px}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;color:var(--acc)}
.month-nav{display:flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--bord);border-radius:9px;padding:5px 8px}
.month-nav button{background:none;border:none;color:var(--sub);font-size:18px;padding:0 2px;line-height:1}
.month-nav span{font-weight:700;font-size:12px;min-width:80px;text-align:center;color:var(--text)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--bord);display:flex;z-index:200}
.nav button{flex:1;background:none;border:none;border-top:2px solid transparent;padding:8px 0 5px;color:var(--sub);font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.nav button.act{color:var(--acc);border-top-color:var(--acc)}
.nav button span.ico{font-size:18px}
.content{padding:12px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:14px;margin-bottom:10px}
.card.glow-acc{box-shadow:0 0 18px #00e5a018;border-color:#00e5a040}
.card.glow-gold{box-shadow:0 0 18px #ffc94a18;border-color:#ffc94a40}
.card.glow-blue{box-shadow:0 0 18px #4d9fff18;border-color:#4d9fff40}
.card.glow-dang{box-shadow:0 0 18px #ff3b5c18;border-color:#ff3b5c40}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:13px;position:relative}
.stat .lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.stat .val{font-size:18px;font-weight:800;letter-spacing:-.5px}
.stat .sub{font-size:10px;color:var(--sub);margin-top:2px}
.pbar{height:7px;border-radius:99px;background:var(--bord);overflow:hidden;margin-top:4px}
.pbar .fill{height:100%;border-radius:99px;transition:width .5s}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--bord)}
.trow:last-child{border-bottom:none}
.trow .icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.trow .info{flex:1;min-width:0}
.trow .info .name{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .info .meta{font-size:10px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .amt{font-weight:800;font-size:13px;white-space:nowrap;margin-right:2px}
.trow .act-btn{background:none;border:none;color:var(--sub);font-size:14px;padding:2px 5px;flex-shrink:0}
.subtabs{display:flex;background:var(--surf);border-radius:12px;padding:3px;border:1px solid var(--bord);margin-bottom:12px;gap:2px}
.subtabs button{flex:1;background:none;border:1px solid transparent;border-radius:9px;padding:8px 8px;color:var(--sub);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.subtabs button.act{background:var(--card);border-color:var(--bord);color:var(--text)}
.cnt-badge{border-radius:99px;padding:1px 7px;font-size:10px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:600;padding:14px}
.modal{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:420px;animation:fadeIn .2s ease;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-close{background:none;border:none;color:var(--sub);font-size:24px;line-height:1;padding:0}
.flabel{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:5px}
.finput{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit}
.fselect{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit}
.fgroup{margin-bottom:13px}
.btn{width:100%;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:14px;font-family:inherit}
.btn-acc{background:var(--acc);color:#000}
.btn-blue{background:var(--blue);color:#000}
.btn-gold{background:var(--gold);color:#000}
.btn-out{background:var(--surf);border:1px solid var(--bord)!important;color:var(--sub)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.btn-sm{border:none;border-radius:10px;padding:8px 16px;font-weight:800;font-size:13px;font-family:inherit}
.big-inp{display:flex;align-items:center;gap:8px;border-radius:10px;padding:11px 14px}
.big-inp input{background:none;border:none;font-size:22px;font-weight:800;color:var(--text);width:100%;font-family:inherit}
.big-inp .sym{font-size:20px;font-weight:800}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-head .title{font-weight:800;font-size:15px}
.sec-head .sub{color:var(--sub);font-size:12px;margin-top:1px}
.empty{text-align:center;padding:32px 16px}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty .t{font-weight:700;font-size:14px;margin-bottom:5px}
.empty .s{color:var(--sub);font-size:12px}
.acc-pill{border-radius:8px;padding:3px 9px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.cbar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cbar-label{font-size:10px;color:var(--sub);width:65px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar-track{flex:1;height:14px;background:var(--bord);border-radius:99px;overflow:hidden;position:relative}
.cbar-fill{height:100%;border-radius:99px;transition:width .6s}
.cbar-bg{position:absolute;top:0;left:0;height:100%;border-radius:99px;opacity:.25}
.cbar-val{font-size:10px;font-weight:700;width:58px;text-align:right;flex-shrink:0}
.donut-wrap{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.trend-row{display:flex;align-items:flex-end;gap:4px;height:80px;padding-top:4px}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.trend-bars{display:flex;gap:2px;align-items:flex-end;height:65px}
.trend-bar{width:10px;border-radius:3px 3px 0 0;min-height:2px;transition:height .5s}
.trend-label{font-size:9px;color:var(--sub)}
/* Toast notification - fixed at BOTTOM above nav */
.toast{position:fixed;bottom:74px;left:12px;right:12px;z-index:800;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;animation:slideUp .3s ease;box-shadow:0 -2px 20px rgba(0,0,0,.4)}
.toast.warn{background:#1a1000;border:1px solid #ff6b3560;color:#ff6b35}
.toast.danger{background:#1a0008;border:1px solid #ff3b5c60;color:#ff3b5c}
.toast.success{background:#001a10;border:1px solid #00e5a060;color:#00e5a0}
/* Calc buttons */
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc-btn{background:var(--surf);border:1px solid var(--bord);border-radius:9px;padding:10px;font-size:15px;font-weight:700;color:var(--text);font-family:inherit}
.calc-btn.op{color:var(--acc)}
.calc-btn.eq{background:var(--acc);color:#000;border-color:var(--acc)}
.calc-btn.clr{color:var(--dang)}
/* Recurring badge */
.rec-badge{display:inline-flex;align-items:center;gap:3px;background:#4d9fff20;border:1px solid #4d9fff40;color:#4d9fff;border-radius:6px;padding:1px 7px;font-size:9px;font-weight:700}
/* Tag pill for custom categories */
.tag-add{display:inline-flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--bord);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--sub);cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DEF_INC_CATS=["Salario","Freelance","Inversiones","Alquiler","Pensión","Bono","Otros"];
const ACC_TYPES=["Corriente","Ahorro","Inversión","Efectivo","Crypto","Otro"];
const REC_FREQ=["Semanal","Quincenal","Mensual","Bimestral","Trimestral","Anual"];
const PAL=["#00e5a0","#4d9fff","#ffc94a","#ff6b35","#c77dff","#ff3b5c","#00d4ff","#a8ff78","#f7971e","#12c2e9"];
const ACOLS=["#4d9fff","#00e5a0","#ffc94a","#c77dff","#ff6b35","#ff3b5c","#12c2e9","#a8ff78"];
const DEF_CATS=[
  {id:"vivienda",name:"Vivienda",icon:"🏠",fixed:true,budget:1200,color:PAL[0]},
  {id:"alimentacion",name:"Alimentación",icon:"🛒",fixed:false,budget:400,color:PAL[1]},
  {id:"transporte",name:"Transporte",icon:"🚗",fixed:false,budget:200,color:PAL[2]},
  {id:"salud",name:"Salud",icon:"💊",fixed:true,budget:150,color:PAL[3]},
  {id:"educacion",name:"Educación",icon:"📚",fixed:true,budget:100,color:PAL[4]},
  {id:"ocio",name:"Ocio",icon:"🎮",fixed:false,budget:150,color:PAL[5]},
  {id:"ropa",name:"Ropa",icon:"👗",fixed:false,budget:100,color:PAL[6]},
  {id:"suscripciones",name:"Suscripciones",icon:"📱",fixed:true,budget:80,color:PAL[7]},
  {id:"restaurantes",name:"Restaurantes",icon:"🍽",fixed:false,budget:200,color:PAL[8]},
  {id:"otros",name:"Otros",icon:"💼",fixed:false,budget:100,color:PAL[9]},
];

const fmt=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fmtN=n=>new Intl.NumberFormat("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const pct=(a,b)=>b===0?0:Math.min(Math.round(a/b*100),999);
const mk=(y,m)=>`${y}-${String(m+1).padStart(2,"0")}`;
const today=()=>new Date().toISOString().slice(0,10);
const clamp=(v,mn,mx)=>Math.min(Math.max(v,mn),mx);
const hex2rgba=(hex,a=1)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;};
const pbarColor=p=>p>=100?"#ff3b5c":p>=80?"#ff6b35":"#00e5a0";
const uid=()=>Date.now()+Math.random();

// ── State ──
let state={
  tab:"dashboard",sub2:"gastos",yr:new Date().getFullYear(),mo:new Date().getMonth(),
  cats:S.get("ft_cats",DEF_CATS),
  exps:S.get("ft_exps",{}),
  incs:S.get("ft_incs",{}),
  accs:S.get("ft_accs",[]),
  goal:S.get("ft_goal",500),
  incCats:S.get("ft_inccats",DEF_INC_CATS),
  recurring:S.get("ft_recurring",[]),
  transfers:S.get("ft_transfers",[]),
  modal:null,
  toast:null,toastTimer:null,
  aiRes:null,aiLoad:false,
};

function derived(){
  const{yr,mo,cats,exps,incs,accs,goal,recurring}=state;
  const key=mk(yr,mo);
  const mExps=exps[key]||[];
  const mIncs=incs[key]||[];
  const mIncome=mIncs.reduce((a,i)=>a+i.amount,0);
  const mSpent=mExps.reduce((a,e)=>a+e.amount,0);
  const mBudget=cats.reduce((a,c)=>a+c.budget,0);
  const mSaved=mIncome-mSpent;
  const mRate=mIncome>0?Math.round(mSaved/mIncome*100):0;
  const catT=cats.map(c=>({...c,spent:mExps.filter(e=>e.catId===c.id).reduce((a,e)=>a+e.amount,0)}));
  const totalBal=accs.reduce((a,c)=>a+c.balance,0);
  const alerts=catT.filter(c=>pct(c.spent,c.budget)>=90&&c.spent>0);
  const key6=Array.from({length:6},(_,i)=>{const d=new Date(yr,mo-5+i);return{label:MONTHS[d.getMonth()].slice(0,3),k:mk(d.getFullYear(),d.getMonth())};});
  const incPie=mIncs.reduce((acc,i)=>{const x=acc.find(a=>a.name===i.category);if(x)x.v+=i.amount;else acc.push({name:i.category||"Otros",v:i.amount,color:PAL[acc.length%PAL.length]});return acc;},[]);
  return{key,mExps,mIncs,mIncome,mSpent,mBudget,mSaved,mRate,catT,totalBal,alerts,key6,incPie};
}

function mut(fn){fn(state);render();}
function save(){S.set("ft_cats",state.cats);S.set("ft_exps",state.exps);S.set("ft_incs",state.incs);S.set("ft_accs",state.accs);S.set("ft_goal",state.goal);S.set("ft_inccats",state.incCats);S.set("ft_recurring",state.recurring);S.set("ft_transfers",state.transfers||[]);}
function showToast(msg,type="success"){
  if(state.toastTimer)clearTimeout(state.toastTimer);
  state.toast={msg,type};
  state.toastTimer=setTimeout(()=>{state.toast=null;render();},2500);
}

// ── Export/Import ──
function exportData(){
  const data={version:2,exported:new Date().toISOString(),cats:state.cats,exps:state.exps,incs:state.incs,accs:state.accs,goal:state.goal,incCats:state.incCats,recurring:state.recurring};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`FinTrack_backup_${today()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast("✅ Backup descargado","success");
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.cats||!data.exps)throw new Error();
      mut(s=>{s.cats=data.cats||DEF_CATS;s.exps=data.exps||{};s.incs=data.incs||{};s.accs=data.accs||[];s.goal=data.goal||500;s.incCats=data.incCats||DEF_INC_CATS;s.recurring=data.recurring||[];s.modal=null;save();});
      showToast("✅ Datos restaurados","success");
    }catch{showToast("❌ Archivo inválido","danger");}
  };
  reader.readAsText(file);
}

// ── HTML helpers ──
const card=(c,cls="",style="")=>`<div class="card ${cls}" style="${style}">${c}</div>`;
const badge=(t,color)=>`<span class="badge" style="background:${hex2rgba(color,.15)};color:${color};border:1px solid ${hex2rgba(color,.3)}">${t}</span>`;
const pbar=(val,max)=>{const p=pct(val,max),c=pbarColor(p);return `<div class="pbar"><div class="fill" style="width:${Math.min(p,100)}%;background:${c}"></div></div>`;};
const statCard=(label,val,sub,color,icon)=>`<div class="stat" style="border-color:${hex2rgba(color,.3)};box-shadow:0 0 16px ${hex2rgba(color,.08)}"><div class="lbl">${label}</div><div class="val" style="color:${color}">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}<span style="position:absolute;right:12px;top:12px;font-size:20px;opacity:.4">${icon}</span></div>`;

function trow(id,iconEmo,iconBg,name,meta,amt,amtColor,isRec){
  return `<div class="trow">
    <div class="icon" style="background:${iconBg}">${iconEmo}</div>
    <div class="info">
      <div class="name">${name}${isRec?` <span class="rec-badge">🔄 Recurrente</span>`:""}</div>
      <div class="meta">${meta}</div>
    </div>
    <div class="amt" style="color:${amtColor||"#e2e8f0"}">${amt}</div>
    <button class="act-btn" data-edit="${id}" title="Editar">✏️</button>
    <button class="act-btn" data-del="${id}" title="Eliminar" style="color:#ff3b5c">✕</button>
  </div>`;
}

// ── Charts ──
function cssBarChart(items){
  const max=Math.max(...items.map(i=>Math.max(i.val,i.budget||0)),1);
  return items.map(i=>{
    const wp=clamp(i.val/max*100,0,100);
    const bp=i.budget?clamp(i.budget/max*100,0,100):0;
    const c=pbarColor(pct(i.val,i.budget||i.val));
    return `<div class="cbar-row"><div class="cbar-label" title="${i.label}">${i.label}</div><div class="cbar-track">${i.budget?`<div class="cbar-bg" style="width:${bp}%;background:${i.color}"></div>`:""}<div class="cbar-fill" style="width:${wp}%;background:${c}"></div></div><div class="cbar-val" style="color:${c}">${fmt(i.val)}</div></div>`;
  }).join("");
}

function donutChart(items){
  const total=items.reduce((a,i)=>a+i.v,0);
  if(!total)return`<div style="text-align:center;color:var(--sub);padding:20px;font-size:12px">Sin datos</div>`;
  let cum=0;
  const r=40,cx=50,cy=50,sw=18,circ=2*Math.PI*r;
  const segs=items.map(item=>{const f=item.v/total,dash=f*circ,gap=circ-dash,off=circ-cum*circ;cum+=f;return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${item.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;}).join("");
  const legend=items.map(i=>`<div class="legend-item"><div class="legend-dot" style="background:${i.color}"></div><span style="flex:1;color:var(--sub)">${i.name}</span><span style="font-weight:700;color:${i.color}">${fmt(i.v)}</span></div>`).join("");
  return`<div class="donut-wrap"><svg width="100" height="100" viewBox="0 0 100 100">${segs}<text x="50" y="54" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="800">${fmt(total)}</text></svg><div style="flex:1">${legend}</div></div>`;
}

function trendChart(key6,exps,incs){
  const data=key6.map(({label,k})=>({label,gasto:(exps[k]||[]).reduce((a,e)=>a+e.amount,0),ingreso:(incs[k]||[]).reduce((a,e)=>a+e.amount,0)}));
  const maxVal=Math.max(...data.map(d=>Math.max(d.gasto,d.ingreso)),1);
  const cols=data.map(d=>{
    const hG=clamp(d.gasto/maxVal*60,2,60),hI=clamp(d.ingreso/maxVal*60,2,60);
    return`<div class="trend-col"><div class="trend-bars"><div class="trend-bar" style="height:${hI}px;background:#00e5a0" title="Ingreso: ${fmt(d.ingreso)}"></div><div class="trend-bar" style="height:${hG}px;background:#ff6b35" title="Gasto: ${fmt(d.gasto)}"></div></div><div class="trend-label">${d.label}</div></div>`;
  }).join("");
  return`<div><div style="display:flex;gap:10px;margin-bottom:8px"><span style="font-size:10px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:#00e5a0;border-radius:2px;display:inline-block"></span>Ingreso</span><span style="font-size:10px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:#ff6b35;border-radius:2px;display:inline-block"></span>Gasto</span></div><div class="trend-row">${cols}</div></div>`;
}

    const aiHtml=aiLoad?`<div class="empty"><div style="font-size:40px;animation:pulse 1s infinite">⚙️</div><div class="t">Analizando...</div></div>`:aiRes&&!aiRes.error?`<div class="g2" style="margin-bottom:10px"><div class="card ${aiRes.puntuacion>=70?"glow-acc":aiRes.puntuacion>=50?"glow-gold":"glow-dang"}" style="text-align:center;padding:14px"><div style="font-size:9px;color:var(--sub);font-weight:600;margin-bottom:4px">PUNTUACIÓN</div><div style="font-size:38px;font-weight:900;color:${aiRes.puntuacion>=70?"#00e5a0":aiRes.puntuacion>=50?"#ffc94a":"#ff3b5c"}">${aiRes.puntuacion}</div><div style="font-size:9px;color:var(--sub)">de 100</div></div><div class="card" style="padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:6px">📝 Resumen</div><p style="color:var(--sub);font-size:11px;line-height:1.6">${aiRes.resumen}</p>${aiRes.alertas?.length?aiRes.alertas.map(a=>`<div style="background:#ff6b3520;border:1px solid #ff6b3530;border-radius:7px;padding:5px 9px;font-size:11px;color:#ff6b35;margin-top:5px">⚠️ ${a}</div>`).join(""):""}</div></div>${aiRes.categorias_reducir?.length?`<div class="card" style="padding:13px;margin-bottom:10px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">✂️ Dónde Reducir</div>${aiRes.categorias_reducir.map(c=>`<div style="background:#ff3b5c15;border:1px solid #ff3b5c25;border-radius:9px;padding:10px;margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-weight:700;font-size:12px">${c.nombre}</span>${badge("Ahorro: "+fmt(c.potencial),"#00e5a0")}</div><p style="color:var(--sub);font-size:11px;line-height:1.5">${c.sugerencia}</p></div>`).join("")}</div>`:""}${aiRes.recomendaciones?.length?`<div class="card" style="padding:13px;margin-bottom:10px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">💡 Recomendaciones</div>${aiRes.recomendaciones.map((r,i)=>`<div style="display:flex;gap:8px;padding:10px;background:#00e5a015;border:1px solid #00e5a025;border-radius:9px;margin-bottom:7px"><div style="width:20px;height:20px;border-radius:50%;background:#00e5a030;display:flex;align-items:center;justify-content:center;color:#00e5a0;font-weight:800;font-size:10px;flex-shrink:0">${i+1}</div><div style="flex:1"><div style="font-weight:700;font-size:12px;margin-bottom:2px">${r.titulo}</div><p style="color:var(--sub);font-size:11px;line-height:1.5">${r.detalle}</p></div></div>`).join("")}</div>`:""}${aiRes.conclusion?`<div class="card glow-acc" style="border-left:3px solid #00e5a0;padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:5px">🎯 Conclusión</div><p style="color:var(--sub);font-size:12px;line-height:1.6">${aiRes.conclusion}</p></div>`:""}`:aiRes?.error?`<div class="card" style="background:#ff3b5c15;text-align:center;padding:24px"><div style="color:#ff3b5c;font-weight:700">${aiRes.error}</div></div>`:`<div class="empty"><div class="ico">🤖</div><div class="t">Análisis Inteligente</div><div class="s">Pulsa el botón para analizar ${MONTHS[mo]}</div></div>`;
    pageHtml=`<div class="sec-head" style="margin-bottom:12px"><div><div class="title">Análisis IA — ${MONTHS[mo]}</div><div class="sub">Recomendaciones personalizadas</div></div></div><button id="run-ai" style="width:100%;background:${aiLoad?"var(--muted)":"linear-gradient(135deg,#00e5a0,#00b4d8)"};color:#000;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:14px;font-family:inherit;margin-bottom:14px;opacity:${aiLoad?.7:1}">${aiLoad?"⏳ Analizando...":"🤖 Analizar mis Finanzas"}</button><div class="g2" style="margin-bottom:12px"><div class="card" style="padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">📊 Resumen</div>${[{l:"Ingresos",v:fmt(mIncome),c:"#00e5a0"},{l:"Gastos",v:fmt(mSpent),c:mSpent>mIncome?"#ff3b5c":"#ff6b35"},{l:"Fijos",v:fmt(mFixed),c:"#4d9fff"},{l:"Variables",v:fmt(mVar),c:"#ffc94a"},{l:"Ahorro",v:fmt(Math.max(mSaved,0)),c:"#00e5a0"},{l:"Tasa",v:mRate+"%",c:mRate>=20?"#00e5a0":mRate>=10?"#ffc94a":"#ff3b5c"}].map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bord);font-size:11px"><span style="color:var(--sub)">${r.l}</span><span style="color:${r.c};font-weight:700">${r.v}</span></div>`).join("")}</div><div class="card" style="padding:13px"><div style="font-weight:700;font-size:12px;margin-bottom:9px">🏆 Top Gastos</div>${[...catT].sort((a,b)=>b.spent-a.spent).slice(0,6).map((c,i)=>`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--sub);font-size:10px;width:12px;font-weight:700">${i+1}</span><span style="font-size:12px">${c.icon}</span><span style="flex:1;font-size:11px">${c.name}</span><span style="font-weight:700;font-size:11px;color:${pct(c.spent,c.budget)>100?"#ff3b5c":"var(--text)"}">${fmt(c.spent)}</span></div>`).join("")}</div></div>${aiHtml}`;

// ── Calculator state ──
let calcState={expr:"",display:"0"};

function calcEval(){
  try{
    const expr=calcState.expr.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-");
    const result=Function('"use strict";return ('+expr+')')();
    calcState.display=String(Math.round(result*100)/100);
    calcState.expr=calcState.display;
  }catch{calcState.display="Error";calcState.expr="";}
}

// ── Events ──
function bindEvents(d){
  const{key,mExps,mIncs}=d;

  // toast close
  document.getElementById("close-toast")?.addEventListener("click",()=>{
    if(state.toastTimer)clearTimeout(state.toastTimer);
    state.toast=null;render();
  });

  // nav
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>mut(s=>{s.tab=b.dataset.tab;})));
  document.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.sub2=b.dataset.sub)));

  // month
  document.getElementById("prev-mo")?.addEventListener("click",()=>mut(s=>{const dd=new Date(s.yr,s.mo-1);s.yr=dd.getFullYear();s.mo=dd.getMonth();}));
  document.getElementById("next-mo")?.addEventListener("click",()=>mut(s=>{const dd=new Date(s.yr,s.mo+1);s.yr=dd.getFullYear();s.mo=dd.getMonth();}));

  // open modals
  document.getElementById("open-exp")?.addEventListener("click",()=>mut(s=>s.modal="exp"));
  document.getElementById("open-inc")?.addEventListener("click",()=>mut(s=>s.modal="inc"));
  document.getElementById("open-acc")?.addEventListener("click",()=>mut(s=>s.modal="acc"));
  document.getElementById("open-goal")?.addEventListener("click",()=>mut(s=>s.modal="goal"));
  document.getElementById("open-transfer")?.addEventListener("click",()=>mut(s=>s.modal="transfer"));

  // save transfer
  document.getElementById("save-transfer")?.addEventListener("click",()=>{
    const amount=parseFloat(document.getElementById("t-amount")?.value);
    const fromId=+document.getElementById("t-from")?.value;
    const toId=+document.getElementById("t-to")?.value;
    const date=document.getElementById("t-date")?.value||today();
    const notes=document.getElementById("t-notes")?.value.trim()||"";
    if(!amount||amount<=0){showToast("⚠️ Ingresa un importe","warn");return;}
    if(fromId===toId){showToast("⚠️ Elige cuentas distintas","warn");return;}
    const fromAcc=state.accs.find(a=>a.id===fromId);
    if(fromAcc&&fromAcc.balance<amount){showToast("⚠️ Saldo insuficiente en cuenta origen","warn");return;}
    mut(s=>{
      s.accs=s.accs.map(a=>{
        if(a.id===fromId)return{...a,balance:Math.round((a.balance-amount)*100)/100};
        if(a.id===toId)return{...a,balance:Math.round((a.balance+amount)*100)/100};
        return a;
      });
      s.transfers=[{id:uid(),fromId,toId,amount,date,notes},...(s.transfers||[])];
      s.modal=null;save();
    });
    showToast(`✅ Transferencia de ${fmt(amount)} realizada`,"success");
  });
  document.getElementById("open-recurring")?.addEventListener("click",()=>mut(s=>s.modal="recurring"));
  document.getElementById("open-add-cat-exp")?.addEventListener("click",()=>mut(s=>s.modal="add-cat-exp"));

  // close modal
  ["close-modal","close-modal2"].forEach(id=>document.getElementById(id)?.addEventListener("click",()=>mut(s=>s.modal=null)));
  document.getElementById("overlay")?.addEventListener("click",e=>{if(e.target.id==="overlay")mut(s=>s.modal=null);});

  // calculator toggle
  document.getElementById("toggle-calc")?.addEventListener("click",()=>{
    const area=document.getElementById("calc-area");
    if(area){calcState={expr:document.getElementById("m-amount")?.value||"",display:document.getElementById("m-amount")?.value||"0"};area.style.display=area.style.display==="none"?"block":"none";}
  });

  // calculator buttons
  document.querySelectorAll("[data-calc]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.calc;
    const disp=document.getElementById("calc-display");
    const inp=document.getElementById("m-amount");
    if(k==="C"){calcState={expr:"",display:"0"};}
    else if(k==="="){calcEval();}
    else if(["÷","×","−","+"].includes(k)){calcState.expr+=k;}
    else{calcState.expr+=k;calcState.display=calcState.expr;}
    if(disp)disp.textContent=calcState.display;
  }));

  document.getElementById("calc-sum")?.addEventListener("click",()=>{
    const inp=document.getElementById("m-amount");
    if(inp&&calcState.display!=="Error"){inp.value=calcState.display;}
    const area=document.getElementById("calc-area");
    if(area)area.style.display="none";
  });

  // recurring toggle in modal
  document.getElementById("m-rec")?.addEventListener("change",e=>{
    const wrap=document.getElementById("rec-freq-wrap");
    if(wrap)wrap.style.display=e.target.checked?"block":"none";
  });

  document.getElementById("save-exp")?.addEventListener("click",()=>{
    const desc=document.getElementById("m-desc")?.value.trim();
    const amount=parseFloat(document.getElementById("m-amount")?.value);
    const catId=document.getElementById("m-cat")?.value;
    const accId=document.getElementById("m-acc-id")?.value?+document.getElementById("m-acc-id")?.value:null;
    const date=document.getElementById("m-date")?.value||today();
    const recurring=document.getElementById("m-rec")?.checked||false;
    const freq=document.getElementById("m-freq")?.value||"Mensual";
    const notes=document.getElementById("m-notes")?.value.trim()||"";
    const editId=document.getElementById("save-exp")?.dataset.id;
    const oldAccId=document.getElementById("save-exp")?.dataset.oldAcc?+document.getElementById("save-exp")?.dataset.oldAcc:null;
    const oldAmt=parseFloat(document.getElementById("save-exp")?.dataset.oldAmt)||0;
    if(!desc||isNaN(amount)||amount<=0){showToast("⚠️ Completa descripción e importe","warn");return;}
    mut(s=>{
      const item={id:editId?+editId:uid(),desc,amount,catId,accId,date,recurring,freq,notes};
      if(editId){
        s.exps={...s.exps,[key]:(s.exps[key]||[]).map(e=>String(e.id)===String(editId)?item:e)};
        // revert old account balance, apply new
        if(oldAccId)s.accs=s.accs.map(a=>a.id===oldAccId?{...a,balance:Math.round((a.balance+oldAmt)*100)/100}:a);
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance-amount)*100)/100}:a);
      } else {
        s.exps={...s.exps,[key]:[...(s.exps[key]||[]),item]};
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance-amount)*100)/100}:a);
      }
      if(recurring){const existing=s.recurring.find(r=>r.id===item.id);if(!existing)s.recurring=[...s.recurring,item];}
      s.modal=null;save();
    });
    const accName=accId?state.accs.find(a=>a.id===accId)?.name:"";
    showToast((editId?"✅ Gasto actualizado":"✅ Gasto guardado")+(accName?" · Descontado de "+accName:""),"success");
  });

  // save income
  document.getElementById("save-inc")?.addEventListener("click",()=>{
    const desc=document.getElementById("m-desc")?.value.trim();
    const amount=parseFloat(document.getElementById("m-amount")?.value);
    const category=document.getElementById("m-cat")?.value;
    const accId=document.getElementById("m-acc-id")?.value?+document.getElementById("m-acc-id")?.value:null;
    const date=document.getElementById("m-date")?.value||today();
    const recurring=document.getElementById("m-rec")?.checked||false;
    const freq=document.getElementById("m-freq")?.value||"Mensual";
    const editId=document.getElementById("save-inc")?.dataset.id;
    const oldAccId=document.getElementById("save-inc")?.dataset.oldAcc?+document.getElementById("save-inc")?.dataset.oldAcc:null;
    const oldAmt=parseFloat(document.getElementById("save-inc")?.dataset.oldAmt)||0;
    if(!desc||isNaN(amount)||amount<=0){showToast("⚠️ Completa descripción e importe","warn");return;}
    mut(s=>{
      const item={id:editId?+editId:uid(),desc,amount,category,accId,date,recurring,freq};
      if(editId){
        s.incs={...s.incs,[key]:(s.incs[key]||[]).map(i=>String(i.id)===String(editId)?item:i)};
        // revert old account balance, apply new
        if(oldAccId)s.accs=s.accs.map(a=>a.id===oldAccId?{...a,balance:Math.round((a.balance-oldAmt)*100)/100}:a);
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance+amount)*100)/100}:a);
      } else {
        s.incs={...s.incs,[key]:[...(s.incs[key]||[]),item]};
        if(accId)s.accs=s.accs.map(a=>a.id===accId?{...a,balance:Math.round((a.balance+amount)*100)/100}:a);
      }
      s.modal=null;save();
    });
    const accName=accId?state.accs.find(a=>a.id===accId)?.name:"";
    showToast((editId?"✅ Ingreso actualizado":"✅ Ingreso guardado")+(accName?" · Sumado a "+accName:""),"success");
  });

  // save account
  document.getElementById("save-acc")?.addEventListener("click",()=>{
    const name=document.getElementById("m-name")?.value.trim();
    const bank=document.getElementById("m-bank")?.value.trim();
    const type=document.getElementById("m-type")?.value;
    const balance=parseFloat(document.getElementById("m-balance")?.value);
    if(!name||isNaN(balance)){showToast("⚠️ Completa nombre y saldo","warn");return;}
    const editId=state.modal?.startsWith("edit-acc-")?+state.modal.replace("edit-acc-",""):null;
    mut(s=>{
      if(editId){s.accs=s.accs.map(a=>a.id===editId?{...a,name,bank,type,balance}:a);}
      else{s.accs=[...s.accs,{id:uid(),name,bank,type,balance,color:ACOLS[s.accs.length%ACOLS.length]}];}
      s.modal=null;save();
    });
    showToast(editId?"✅ Cuenta actualizada":"✅ Cuenta añadida","success");
  });

  // save goal
  document.getElementById("save-goal")?.addEventListener("click",()=>{
    const v=parseFloat(document.getElementById("m-goal")?.value);
    if(v>0)mut(s=>{s.goal=v;s.modal=null;save();});
    else mut(s=>s.modal=null);
  });

  // save custom category
  document.getElementById("save-cat")?.addEventListener("click",()=>{
    const type=document.getElementById("save-cat")?.dataset.type;
    const name=document.getElementById("m-catname")?.value.trim();
    if(!name){showToast("⚠️ Escribe un nombre","warn");return;}
    if(type==="inc"){
      mut(s=>{s.incCats=[...s.incCats,name];s.modal=null;save();});
      showToast("✅ Categoría de ingreso añadida","success");
    } else {
      const icon=document.getElementById("m-caticon")?.value||"💼";
      const budget=parseFloat(document.getElementById("m-catbudget")?.value)||0;
      const fixed=document.querySelector('input[name="cattype"]:checked')?.value==="fixed";
      const color=PAL[state.cats.length%PAL.length];
      const id=name.toLowerCase().replace(/\s+/g,"_")+Date.now();
      mut(s=>{s.cats=[...s.cats,{id,name,icon,fixed,budget,color}];s.modal=null;save();});
      showToast("✅ Categoría añadida","success");
    }
  });

  // edit items
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    const raw=b.dataset.edit;
    if(raw.endsWith("_exp")){const id=raw.replace("_exp","");mut(s=>s.modal="edit-exp-"+id);}
    else if(raw.endsWith("_inc")){const id=raw.replace("_inc","");mut(s=>s.modal="edit-inc-"+id);}
  }));

  // delete items
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const raw=b.dataset.del;
    mut(s=>{
      if(raw.endsWith("_exp")){
        const id=raw.replace("_exp","");
        const exp=(s.exps[key]||[]).find(e=>String(e.id)===id);
        if(exp?.accId)s.accs=s.accs.map(a=>a.id===exp.accId?{...a,balance:Math.round((a.balance+exp.amount)*100)/100}:a);
        s.exps={...s.exps,[key]:(s.exps[key]||[]).filter(e=>String(e.id)!==id)};
      }
      else if(raw.endsWith("_inc")){
        const id=raw.replace("_inc","");
        const inc=(s.incs[key]||[]).find(i=>String(i.id)===id);
        if(inc?.accId)s.accs=s.accs.map(a=>a.id===inc.accId?{...a,balance:Math.round((a.balance-inc.amount)*100)/100}:a);
        s.incs={...s.incs,[key]:(s.incs[key]||[]).filter(i=>String(i.id)!==id)};
      }
      save();
    });
    showToast("🗑️ Eliminado","success");
  }));

  document.querySelectorAll("[data-edit-acc]").forEach(b=>b.addEventListener("click",()=>mut(s=>s.modal="edit-acc-"+b.dataset.editAcc)));
  document.querySelectorAll("[data-del-acc]").forEach(b=>b.addEventListener("click",()=>{mut(s=>{s.accs=s.accs.filter(a=>a.id!==+b.dataset.delAcc);save();});showToast("🗑️ Cuenta eliminada","success");}));
  document.querySelectorAll("[data-del-cat]").forEach(b=>b.addEventListener("click",()=>{mut(s=>{s.cats=s.cats.filter(c=>c.id!==b.dataset.delCat);save();});showToast("🗑️ Categoría eliminada","success");}));
  document.querySelectorAll("[data-del-rec]").forEach(b=>b.addEventListener("click",()=>{mut(s=>{s.recurring=s.recurring.filter(r=>String(r.id)!==b.dataset.delRec);save();});showToast("🗑️ Recurrente eliminado","success");}));

  document.querySelectorAll("[data-budget]").forEach(inp=>inp.addEventListener("change",()=>{mut(s=>{s.cats=s.cats.map(c=>c.id===inp.dataset.budget?{...c,budget:parseFloat(inp.value)||0}:c);save();});}));
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>mut(s=>{s.cats=s.cats.map(c=>c.id===b.dataset.toggle?{...c,fixed:!c.fixed}:c);save();})));

  // backup
  document.getElementById("do-export")?.addEventListener("click",exportData);
  document.getElementById("import-file")?.addEventListener("change",e=>importData(e.target.files[0]));

  // AI
  document.getElementById("run-ai")?.addEventListener("click",()=>{
    if(state.aiLoad)return;
    mut(s=>{s.aiLoad=true;s.aiRes=null;});

    // ── Motor de análisis financiero local ──
    setTimeout(()=>{
      const d2=derived();
      const {mIncome,mSpent,mSaved,mRate,catT}=d2;
      const goal=state.goal;
      const accs=state.accs;

      // ── Puntuación ──
      let score=100;
      let alertas=[];
      let recomendaciones=[];
      let categorias_reducir=[];

      // Tasa de ahorro
      if(mRate<0){score-=30;alertas.push("Estás gastando más de lo que ganas este mes.");}
      else if(mRate<10){score-=20;alertas.push("Tu tasa de ahorro es muy baja ("+mRate+"%). Lo ideal es al menos 20%.");}
      else if(mRate<20){score-=10;alertas.push("Tu tasa de ahorro ("+mRate+"%) está por debajo del 20% recomendado.");}

      // Meta de ahorro
      if(goal>0&&mSaved<goal){
        const diff=goal-mSaved;
        score-=10;
        alertas.push("No alcanzaste tu meta de ahorro. Te faltan "+fmt(diff)+".");
        recomendaciones.push({titulo:"Alcanza tu meta de ahorro",detalle:"Para llegar a tu meta de "+fmt(goal)+" necesitas reducir gastos en "+fmt(diff)+". Revisa categorías variables primero.",ahorro:Math.round(diff)});
      }

      // Categorías excedidas
      const excedidas=catT.filter(c=>c.spent>c.budget&&c.budget>0);
      excedidas.forEach(c=>{
        const extra=c.spent-c.budget;
        score-=8;
        alertas.push(c.name+" excedió su presupuesto en "+fmt(extra)+".");
        categorias_reducir.push({nombre:c.name,potencial:Math.round(extra),sugerencia:"Reducir a tu presupuesto de "+fmt(c.budget)+" te ahorraría "+fmt(extra)+" al mes."});
      });

      // Categorías con alto gasto variable
      const varAltas=catT.filter(c=>!c.fixed&&c.spent>0&&c.budget>0&&pct(c.spent,c.budget)>75&&!excedidas.find(e=>e.id===c.id));
      varAltas.slice(0,3).forEach(c=>{
        const potencial=Math.round(c.spent*0.15);
        categorias_reducir.push({nombre:c.name,potencial,sugerencia:"Estás usando el "+pct(c.spent,c.budget)+"% de tu presupuesto en "+c.name+". Reducir un 15% te ahorraría "+fmt(potencial)+" al mes."});
      });

      // Sin ingresos registrados
      if(mIncome===0){score-=15;alertas.push("No tienes ingresos registrados este mes.");}

      // Sin cuentas
      if(accs.length===0){recomendaciones.push({titulo:"Añade tus cuentas bancarias",detalle:"Registrar tus cuentas te permite ver tu patrimonio total y llevar un control real de tu dinero.",ahorro:0});}

      // Gastos fijos vs variables
      const totalFijo=catT.filter(c=>c.fixed).reduce((a,c)=>a+c.spent,0);
      const totalVar=catT.filter(c=>!c.fixed).reduce((a,c)=>a+c.spent,0);
      if(mIncome>0&&totalFijo/mIncome>0.6){
        score-=10;
        alertas.push("Tus gastos fijos representan el "+Math.round(totalFijo/mIncome*100)+"% de tus ingresos, lo cual es muy alto.");
        recomendaciones.push({titulo:"Reduce compromisos fijos",detalle:"Lo ideal es que los gastos fijos no superen el 50% de tus ingresos. Revisa suscripciones y compromisos recurrentes.",ahorro:Math.round(totalFijo*0.1)});
      }

      // Recomendación de fondo de emergencia
      if(mRate>=20){
        recomendaciones.push({titulo:"Construye tu fondo de emergencia",detalle:"Con tu tasa de ahorro del "+mRate+"% vas muy bien. Destina 3-6 meses de gastos ("+fmt(mSpent*3)+"–"+fmt(mSpent*6)+") a un fondo de emergencia.",ahorro:0});
      }

      // Recomendación genérica de inversión
      if(mSaved>goal*1.5&&goal>0){
        recomendaciones.push({titulo:"Considera invertir tu excedente",detalle:"Tienes un superávit de "+fmt(mSaved-goal)+" sobre tu meta. Considera opciones de inversión como fondos indexados o cuentas de ahorro de alto rendimiento.",ahorro:0});
      }

      // Sin gastos variables altos — positivo
      if(varAltas.length===0&&excedidas.length===0&&mSpent>0){
        recomendaciones.push({titulo:"¡Buen control de gastos!",detalle:"Todas tus categorías variables están dentro del presupuesto. Sigue así y considera aumentar tu meta de ahorro.",ahorro:0});
      }

      // Clamp score
      score=Math.max(10,Math.min(100,score));

      // ── Resumen ──
      const resumen=mIncome===0
        ?"No tienes ingresos registrados este mes. Añade tus ingresos para obtener un análisis completo."
        :mRate>=20
          ?"Excelente mes — tienes una tasa de ahorro del "+mRate+"% y un excedente de "+fmt(mSaved)+". Estás en la dirección correcta."
          :mRate>=10
            ?"Mes razonable con un ahorro del "+mRate+"%. Puedes mejorar reduciendo gastos variables y optimizando categorías excedidas."
            :mRate>=0
              ?"Mes ajustado — solo el "+mRate+"% de ahorro. Revisa tus gastos variables y asegúrate de cumplir tu presupuesto."
              :"Mes en negativo — gastaste "+fmt(Math.abs(mSaved))+" más de lo que ganaste. Es urgente revisar y reducir gastos.";

      // ── Conclusión ──
      const conclusion=score>=80
        ?"Tu salud financiera este mes es muy buena. Mantén la disciplina, aumenta gradualmente tu meta de ahorro y considera invertir el excedente."
        :score>=60
          ?"Tienes una base sólida pero hay áreas de mejora. Enfócate en las categorías excedidas y en aumentar tu tasa de ahorro al 20%."
          :score>=40
            ?"Necesitas atención en tus finanzas este mes. Prioriza reducir gastos no esenciales y asegúrate de no gastar más de lo que ingresas."
            :"Situación financiera crítica este mes. Revisa urgentemente todos tus gastos y busca formas de aumentar ingresos o reducir compromisos.";

      mut(s=>{
        s.aiRes={resumen,alertas,recomendaciones,categorias_reducir,puntuacion:score,conclusion};
        s.aiLoad=false;
      });
    },800); // simula tiempo de procesamiento
  });
}

function render(){const d=derived();document.getElementById("app").innerHTML=buildApp(d);bindEvents(d);}
render();
</script>
</body>
</html>
